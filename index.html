<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribuidora C y M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Ferretería de barrio con vitrina de tienda grande: blanco limpio, tinta casi negra, amarillo de seguridad.
   Layout: encabezado fijo con buscador inteligente, banners, carruseles de producto, ficha completa y carrito lateral. */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#17171B; --muted:#67635C; --line:#E6E3DC; --soft:#F0EEE8;
  --accent:#F5B700; --accent-hi:#FFCF3F; --dark:#121316; --ok:#13804A; --hot:#D7263D;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --wrap:1240px; --shadow:0 1px 2px rgba(20,18,12,.06),0 6px 18px rgba(20,18,12,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 14px}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.96}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- promo bar + header ---------- */
.promo{background:var(--dark);color:#EDEAE2;font-size:14px;overflow:hidden}
.promo .wrap{display:flex;justify-content:center;align-items:center;gap:10px;height:36px}
.promo b{color:var(--accent)}
.promo .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s}
header.site{background:var(--surface);position:sticky;top:0;z-index:40;box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;gap:14px 22px;padding-top:12px;padding-bottom:12px}
.logo{flex:0 0 auto;line-height:0}
.logo img{height:56px;width:auto}
.search{position:relative;flex:1 1 auto;min-width:0}
.sbox{display:flex;height:50px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);overflow:hidden}
.sbox input{flex:1 1 auto;min-width:0;border:0;padding:0 14px;font-size:16px;font-weight:500;background:transparent;outline:none}
.sbox button{width:58px;border:0;background:var(--accent);display:flex;align-items:center;justify-content:center}
.sbox:focus-within{box-shadow:0 0 0 4px rgba(245,183,0,.35)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);border:1px solid var(--line);padding:8px;display:none;max-height:min(70vh,560px);overflow:auto;z-index:60}
.suggest.open{display:block}
.sg-sec{padding:6px 8px 4px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sg-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 8px 8px}
.sg-item{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px;border-radius:10px;text-decoration:none}
.sg-item[aria-selected="true"],.sg-item:hover{background:var(--soft)}
.sg-item .th{width:52px;height:52px;border-radius:8px;border:1px solid var(--line)}
.sg-item b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.sg-item small{color:var(--muted)}
.sg-item mark{background:#FFE89A;color:inherit;border-radius:2px}
.sg-all{display:block;text-align:center;padding:12px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;text-decoration:none}
.hact{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hbtn{display:flex;align-items:center;gap:8px;height:50px;padding:0 14px;border:0;border-radius:12px;background:transparent;font-weight:600}
.hbtn:hover{background:var(--soft)}
.cartbtn{background:var(--ink);color:#fff;padding:0 16px}
.cartbtn:hover{background:#000}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--ink);font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
.catbar{border-top:1px solid var(--line)}
.catbar .wrap{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.catbar .wrap::-webkit-scrollbar{display:none}
.catbar a,.catbar button{padding:11px 12px;font-weight:600;font-size:15px;text-decoration:none;border-radius:8px;border:0;background:none;display:inline-flex;align-items:center;gap:8px}
.catbar a:hover,.catbar button:hover{background:var(--soft)}
.catbar a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
.catbar .all{background:var(--accent);margin-right:6px}
.catbar .all:hover{background:var(--accent-hi)}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--surface);box-shadow:0 24px 50px rgba(0,0,0,.16);border-top:1px solid var(--line);display:none;z-index:55}
.mega.open{display:block}
.mega .grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;padding-top:16px;padding-bottom:20px}
.mega a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;text-decoration:none}
.mega a:hover{background:var(--soft)}
.mega .ic{width:44px;height:44px;border-radius:10px;background:#FFF4CC;display:flex;align-items:center;justify-content:center}
.mega b{display:block;font-size:15px}
.mega small{color:var(--muted)}
@media (max-width:860px){
  .hrow{flex-wrap:wrap}
  .search{order:3;flex-basis:100%}
  .logo img{height:46px}
  .hact{margin-left:auto}
  .hbtn .lbl{display:none}
  .catbar .all{display:none}
}

/* ---------- bottom nav (mobile) ---------- */
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;font-weight:600;text-decoration:none;background:none;border:0;position:relative}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;font-size:12px}
  .tabbar [aria-current="page"]{color:var(--ink)}
  .tabbar [aria-current="page"] svg{stroke:var(--ink);fill:var(--accent)}
  body{padding-bottom:70px}
  .toast{bottom:84px!important}
}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.btn:hover{background:#000}
.btn.acc{background:var(--accent);color:var(--ink)}
.btn.acc:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.btn.light{background:#fff;color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid #D7D3CA;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{color:var(--muted);font-weight:500}
.chip.on small,.chip[aria-pressed="true"] small{color:#CFCBC2}

/* ---------- hero slider ---------- */
.hero{padding-top:20px}
.slider{position:relative;border-radius:22px;overflow:hidden;background:var(--dark);min-height:340px}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
.slide.on{opacity:1;visibility:visible;position:relative}
.slide .txt{padding:44px 44px 56px;display:flex;flex-direction:column;justify-content:center;gap:16px;color:#fff;z-index:1}
.slide .tag{align-self:flex-start;background:var(--accent);color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:6px}
.slide h2{margin:0;font-size:clamp(38px,5vw,64px)}
.slide p{margin:0;font-size:18px;color:#D9D5CC;max-width:470px}
.slide .art{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:26px 26px 26px 0;align-content:center}
.slide .art .ph{background:#fff;border-radius:16px;aspect-ratio:1/1;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.slide .art .ph:nth-child(2){transform:translateY(18px)}
.slide .art .ph:nth-child(3){transform:translateY(-8px)}
.slide .art .ph .spr{position:absolute;inset:6%}
.slide.y{background:var(--accent)}
.slide.y .txt{color:var(--ink)}
.slide.y p{color:#3B372F}
.slide.y .tag{background:var(--ink);color:var(--accent)}
.slide.r{background:linear-gradient(120deg,#B5162B,#E03A3E)}
.slide .stripe{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 16px,var(--ink) 16px 32px)}
.dots{position:absolute;left:44px;bottom:26px;display:flex;gap:8px;z-index:3}
.dots button{width:28px;height:6px;border-radius:3px;border:0;background:rgba(255,255,255,.4);padding:0}
.dots button[aria-current="true"]{background:#fff;width:44px}
.sarrow{position:absolute;bottom:22px;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:var(--shadow)}
.sarrow.prev{right:72px}.sarrow.next{right:20px}
@media (max-width:760px){
  .slider{min-height:0}
  .slide{grid-template-columns:1fr}
  .slide .txt{padding:26px 22px 14px;gap:12px}
  .slide p{font-size:16px}
  .slide .art{grid-template-columns:repeat(3,1fr);padding:6px 18px 44px;gap:10px}
  .slide .art .ph:nth-child(4){display:none}
  .dots{left:22px;bottom:18px}
  .sarrow{display:none}
}
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.val{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.val .ic{width:42px;height:42px;border-radius:10px;background:#FFF4CC;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.val b{display:block;font-size:16px;line-height:1.15}
.val small{color:var(--muted);font-size:13.5px}
@media (max-width:900px){.values{grid-template-columns:repeat(2,1fr)}}

/* ---------- sections ---------- */
section.blk{padding-top:40px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:16px}
.sh h2{margin:0;font-size:clamp(30px,4vw,40px)}
.sh p{margin:4px 0 0;color:var(--muted)}
.sh .ctl{display:flex;gap:8px;align-items:center}
.arr{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.arr:hover{border-color:var(--ink)}
@media (max-width:760px){.arr{display:none}}
.seeall{font-weight:700;white-space:nowrap}
.cats{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
@media (max-width:1100px){.cats{grid-template-columns:repeat(4,1fr)}}
@media (max-width:600px){.cats{grid-template-columns:repeat(4,minmax(78px,1fr));overflow-x:auto;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-template-columns:none;grid-auto-columns:96px;padding-bottom:6px;scrollbar-width:none}}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;text-align:center}
.cat .ph{width:100%;aspect-ratio:1/1;background:var(--surface);border-radius:18px;position:relative;box-shadow:var(--shadow);transition:transform .2s}
.cat:hover .ph{transform:translateY(-3px)}
.cat .ph .spr{position:absolute;inset:12%}
.cat b{font-size:14.5px;line-height:1.15;font-weight:700}
.cat small{color:var(--muted);font-size:12.5px;margin-top:-6px}

/* ---------- product card + rails ---------- */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 4*16px)/5);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin;scroll-behavior:smooth}
.rail>*{scroll-snap-align:start}
@media (max-width:1100px){.rail{grid-auto-columns:calc((100% - 3*14px)/4);gap:14px}}
@media (max-width:760px){.rail{grid-auto-columns:46%;gap:12px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:box-shadow .2s,transform .2s;min-width:0}
.card:hover{box-shadow:0 10px 30px rgba(20,18,12,.14);transform:translateY(-2px)}
.card .ph{display:block;position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.card .ph .spr,.card .ph .noimg{position:absolute;inset:6%;transition:transform .35s}
.card:hover .ph .spr{transform:scale(1.06)}
.flag{position:absolute;left:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.flag span{font-size:12px;font-weight:800;padding:4px 8px;border-radius:6px;background:var(--ink);color:#fff;letter-spacing:.02em}
.flag .promo-f{background:var(--hot)}
.flag .var-f{background:#fff;color:var(--ink);border:1px solid var(--line)}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex-grow:1}
.brandtag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8A6A00}
.card h3{margin:0;font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:3.9em}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.code{font-size:13px;color:var(--muted)}
.price{font-size:13.5px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.price.has{font-family:var(--display);font-size:24px;color:var(--ink)}
.add{position:relative;z-index:2;margin-top:auto;padding-top:8px}
.addbtn{height:42px;width:100%;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.addbtn:hover{background:#000}
.stepper{display:flex;align-items:center;height:42px;border-radius:10px;overflow:hidden;background:var(--accent)}
.stepper button{width:44px;height:100%;border:0;background:var(--ink);color:#fff;font-size:20px;font-weight:700;flex:0 0 auto}
.stepper input{flex:1 1 auto;min-width:0;width:100%;height:100%;border:0;text-align:center;font-weight:800;background:transparent;font-size:16px}
.noimg{background:var(--soft);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A39E94}
.spr{display:block;background-repeat:no-repeat;background-size:600% 600%;background-color:#fff}

/* ---------- banners ---------- */
.banner2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.banner2{grid-template-columns:1fr}}
.bn{border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr;min-height:220px;text-decoration:none;position:relative;box-shadow:var(--shadow)}
.bn .t{padding:26px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.bn h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:34px;line-height:.95}
.bn p{margin:0}
.bn .imgs{position:relative}
.bn .imgs .spr{position:absolute;width:62%;aspect-ratio:1/1;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.bn .imgs .spr:nth-child(1){right:22%;top:12%}
.bn .imgs .spr:nth-child(2){right:4%;bottom:10%;width:52%}
@media (max-width:600px){.bn{grid-template-columns:1fr 128px;min-height:0}.bn .t{padding:20px}.bn h3{font-size:28px}.bn .imgs .spr:nth-child(1){right:10%;top:10%;width:80%}.bn .imgs .spr:nth-child(2){display:none}.bn .btn{white-space:nowrap}}
.bn.dark{background:var(--dark);color:#fff}
.bn.dark p{color:#CFCBC2}
.bn.red{background:linear-gradient(135deg,#B5162B,#E03A3E);color:#fff}
.bn.red p{color:#FFE1E3}
.bn.yel{background:var(--accent)}
.slide.g{background:linear-gradient(120deg,#0E4A2E,#1F8F45)}
.slide.b{background:linear-gradient(120deg,#0A2450,#1F56B0)}
.slide.k{background:linear-gradient(120deg,#121212,#34312C)}
.slide.o{background:linear-gradient(120deg,#B23A06,#F2780C)}
.slide.o p,.slide.g p,.slide.b p{color:#F3EFE6}
/* selector de colores 7FC */
.pick7{border-radius:24px;overflow:hidden;display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:0;background:#141414;color:#fff;box-shadow:var(--shadow);position:relative}
.pick7:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 30%,rgba(255,61,165,.35),transparent 40%),radial-gradient(circle at 40% 90%,rgba(31,86,176,.45),transparent 45%),radial-gradient(circle at 85% 10%,rgba(255,209,0,.30),transparent 40%);pointer-events:none}
.pick7 .can{position:relative;margin:22px;border-radius:20px;background:#fff;min-height:300px}
.pick7 .can .spr{position:absolute;inset:5% 6% 15% 6%;transition:opacity .2s}
.pick7 .can .nm{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--ink);font-weight:800;font-size:15px;text-transform:capitalize}
.pick7 .tx{position:relative;padding:30px 30px 30px 8px;display:flex;flex-direction:column;gap:10px}
.pick7 h2{margin:0;color:#fff;font-size:clamp(30px,4vw,46px)}
.pick7 p{margin:0;color:#D9D5CC}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:10px;margin:8px 0 6px}
.sw a{aspect-ratio:1/1;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.45);transition:transform .15s ease}
.sw a:hover,.sw a:focus-visible,.sw a.on{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 6px 16px rgba(0,0,0,.5)}
@media (max-width:760px){.pick7{grid-template-columns:1fr}.pick7 .can{min-height:240px;margin:16px 16px 0}.pick7 .tx{padding:18px 18px 22px}.sw{grid-template-columns:repeat(8,1fr);gap:8px}}
/* anuncios */
.banner3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:980px){.banner3{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.banner3{grid-template-columns:1fr}}
.bt{border-radius:20px;padding:20px 16px 20px 22px;min-height:190px;display:grid;grid-template-columns:1fr 150px;gap:12px;text-decoration:none;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.bt:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.18)}
.bt .t{display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;z-index:1}
.bt h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:27px;line-height:.95}
.bt p{margin:0;font-size:14px;opacity:.92}
.bt .go{margin-top:6px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.bt .im{position:relative}
.bt .im .spr{position:absolute;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.bt .im .spr:nth-child(1){inset:4% 4% 22% 0}
.bt .im .spr:nth-child(2){width:46%;aspect-ratio:1/1;right:4px;bottom:0;border:3px solid rgba(255,255,255,.9)}
.bt.g{background:linear-gradient(135deg,#0E4A2E,#2E9E4F)}
.bt.b{background:linear-gradient(135deg,#0A2450,#2563C9)}
.bt.o{background:linear-gradient(135deg,#B23A06,#F2780C)}

const isPromo=p=>p.b==='M&R'&&/12\+1/.test(p.d||'');
function qtyCtl(p,ctx){const q=cart[p.id]||0;
  if(!q)return `<button class="addbtn" type="button" data-add="${p.id}" aria-label="Agregar ${esc(p.t)} al carrito">${ic('plus','width:18px;height:18px;stroke-width:2.6')}Agregar</button>`;
  return `<div class="stepper"><button type="button" data-dec="${p.id}" aria-label="Quitar uno">−</button><label class="vh" for="q${ctx}${p.id}">Cantidad</label><input id="q${ctx}${p.id}" class="num" inputmode="numeric" value="${q}" data-qty="${p.id}"><button type="button" data-inc="${p.id}" aria-label="Agregar uno">+</button></div>`}
function card(p,ctx){ctx=ctx||'g';const fam=p.f?FAM[p.f].length:0;
  return `<article class="card">
   <a class="ph" href="#p-${p.id}" tabindex="-1" aria-hidden="true">${spr(p)}</a>
   <div class="flag">${isPromo(p)?'<span class="promo-f">12 + 1 gratis</span>':''}${fam>1?`<span class="var-f">${fam} opciones</span>`:''}</div>
   <div class="bd">${p.b?`<span class="brandtag">${esc(bname(p.b))}</span>`:''}
    <h3><a href="#p-${p.id}">${esc(p.t)}</a></h3>
    ${p.c||p.m?`<span class="code num">${p.c?'Cód. '+esc(p.c):''}${p.c&&p.m?' · ':''}${p.m?'Mod. '+esc(p.m):''}</span>`:''}
    ${p.pr?`<div class="price has num">${crc(p.pr)}</div>`:`<div class="price">${ic('tag','width:15px;height:15px')}Precio a consultar</div>`}
    <div class="add" data-slot="${p.id}" data-ctx="${ctx}">${qtyCtl(p,ctx)}</div></div></article>`}
function rail(id,title,sub,list,href,ctx){if(!list.length)return '';
  return `<section class="wrap blk" aria-labelledby="h-${id}"><div class="sh"><div><h2 id="h-${id}" class="disp">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><div class="ctl">${href?`<a class="seeall" href="${href}">Ver todo</a>`:''}<button class="arr" type="button" data-rail="${id}" data-dir="-1" aria-label="Anterior">${ic('left')}</button><button class="arr" type="button" data-rail="${id}" data-dir="1" aria-label="Siguiente">${ic('right')}</button></div></div><div class="rail" id="rail-${id}">${list.map(p=>card(p,ctx||id)).join('')}</div></section>`}

function score(p,groups,raw){let s=0;for(const g of groups){let t=null,j=0;for(;j<g.length;j++){if(p._s.includes(g[j])){t=g[j];break}}if(t===null)return 0;s-=j*.6;if(p._t.startsWith(t))s+=6;else if(p._t.includes(' '+t))s+=4;else if(p._t.includes(t))s+=2;else s+=1}
  if(p.c&&norm(p.c)===raw)s+=50;if(p.i)s+=.5;return s}
function search(q){const raw=norm(q).trim();const toks=raw.split(/\s+/).filter(Boolean);if(!toks.length)return [];const groups=toks.map(alts);const out=[];for(const p of P){let s=score(p,groups,raw);if(s&&p.c&&norm(p.c)===raw)s+=1000;if(s)out.push([s,p])}out.sort((a,b)=>b[0]-a[0]||a[1].id-b[1].id);return out.map(x=>x[1])}
function hl(text,q){const toks=norm(q).split(/\s+/).filter(t=>t.length>1);if(!toks.length)return esc(text);const n=norm(text);const marks=new Array(text.length).fill(false);toks.forEach(t=>{let i=n.indexOf(t);while(i>=0){for(let k=i;k<i+t.length;k++)marks[k]=true;i=n.indexOf(t,i+t.length)}});let out='',on=false;for(let i=0;i<text.length;i++){if(marks[i]&&!on){out+='<mark>';on=true}if(!marks[i]&&on){out+='</mark>';on=false}out+=esc(text[i])}return out+(on?'</mark>':'')}

   :`<div style="padding:14px 10px"><b>Sin resultados para “${esc(q)}”.</b><div style="color:var(--muted)">Pruebe con otra palabra o con el código del producto.</div></div>`);

document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
  if(d.add){setQty(d.add,(cart[d.add]||0)+1,true);if(t.closest('#chat')){chatRender(true);return}if(t.closest('#added')){showAdded(addedP);return}if($('#drawer').classList.contains('open')){renderDrawer();return}if(t.closest('#forgot')){note('Agregado a su pedido');return}showAdded(BY.get(+d.add));return}
  if(d.kit!==undefined){addKit(+d.kit);return}
  if('fbtadd' in d){fbtAdd();return}
  if(d.adva){ADV={a:d.adva,b:null,c:null};viewAdvisor(undefined,'adv2');return}
  if(d.advb){ADV.b=d.advb;ADV.c=null;viewAdvisor(undefined,'adv3');return}
  if(d.advc){ADV.c=d.advc;viewAdvisor(undefined,'advres');return}
  if('advall' in d){advAll();return}
  if('advreset' in d){ADV={a:null,b:null,c:null};viewAdvisor(undefined,'adv1');return}
  if('cwclose' in d){const w=$('#cwaitw');w&&w.remove();return}
  if('reorder' in d){reorder();return}
  if('addclose' in d){hideAdded();return}
  if(d.inc){setQty(d.inc,(cart[d.inc]||0)+1,true);return}
  if(d.dec){setQty(d.dec,(cart[d.dec]||0)-1);return}
  if(d.rm){setQty(d.rm,0);return}
  if('opencart' in d){e.preventDefault();openCart();return}
  if('close' in d){closeAll();return}
  if('empty' in d){const ids=Object.keys(cart);cart={};saveCart();ids.forEach(id=>refresh(+id));renderDrawer();return}
  if('more' in d){loadMore();return}
  if('minc' in d||'mdec' in d){const i=$('#mq');i.value=Math.max(1,(+i.value||1)+('minc' in d?1:-1));return}
  if(d.madd){const q=Math.max(1,Math.floor(+$('#mq').value||1));setQty(d.madd,(cart[d.madd]||0)+q,true);showAdded(BY.get(+d.madd));return}
  if(d.rail){const r=$('#rail-'+d.rail);r&&r.scrollBy({left:(+d.dir)*r.clientWidth*.9,behavior:'smooth'});return}
  if(d.slide){goSlide(+d.slide);autoSlide();return}
  if(d.slidestep){goSlide(slideI+(+d.slidestep));autoSlide();return}
  if(d.unbrand){S.brands=S.brands.filter(b=>b!==d.unbrand);S.shown=PAGE;rerenderFilters();return}
  if(d.unsub){S.sub='';S.shown=PAGE;renderList();return}
  if(d.sub!==undefined){S.sub=S.sub===d.sub?'':d.sub;S.shown=PAGE;renderList();return}
  if(d.allres){e.preventDefault();doSearch();return}
  if(d.scroll){e.preventDefault();$('#'+d.scroll).scrollIntoView({behavior:'smooth'});return}
  if(t.id==='openfilters'){openFilters();return}
  if(d.tab==='cats'){openCatsSheet();return}
  if(d.tab==='buscar'){window.scrollTo(0,0);$('#q').focus();return}
  if(d.tab==='cart'){openCart();return}
  if(t.tagName==='A'&&t.getAttribute('href')&&t.getAttribute('href').startsWith('#')&&t.getAttribute('href')===location.hash){route();window.scrollTo(0,0)}
});
function rerenderFilters(){document.querySelectorAll('[data-brandchk]').forEach(ch=>ch.checked=S.brands.includes(ch.value));renderList()}
document.addEventListener('change',e=>{const t=e.target;
  if(t.matches('[data-qty]')){setQty(t.dataset.qty,t.value);return}
  if(t.matches('[data-brandchk]')){S.brands=t.checked?[...new Set([...S.brands,t.value])]:S.brands.filter(b=>b!==t.value);S.shown=PAGE;rerenderFilters();const sh=$('#sheet');if(sh.classList.contains('open')){const btn=sh.querySelector('.dfoot .btn');btn&&(btn.textContent=`Ver ${fmt((S._ll||[]).length)} productos`)}return}
  if(t.matches('[data-sort]')){S.sort=t.value;S.shown=PAGE;renderList();return}
  if(t.name==='entrega'){$('#dirbox').hidden=t.value!=='envio';return}
  if(t.id==='f-vol'){$('#empbox').hidden=!t.checked;draft={...draft,...readForm()};store.set('cym_draft',draft);return}
  if(t.matches('[data-fbtchk]')){fbtLabel();return}});
document.addEventListener('input',e=>{if(e.target.closest('#ckform')){draft={...draft,...readForm()};store.set('cym_draft',draft)}});
document.addEventListener('submit',e=>{if(e.target.id==='ckform')submitOrder(e)});
$('#cartbtn').addEventListener('click',openCart);
const totop=$('#totop');addEventListener('scroll',()=>{totop.classList.toggle('show',scrollY>1200);totop.classList.toggle('up',!!document.querySelector('.stickybuy'))},{passive:true});totop.addEventListener('click',()=>{window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
$('#ov').addEventListener('click',()=>closeAll());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideAdded();if($('#ov').classList.contains('open'))closeAll();toggleMega(false)}});
let sx=null;document.addEventListener('touchstart',e=>{if(e.target.closest('#slider'))sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>45){goSlide(slideI+(dx<0?1:-1));autoSlide()}},{passive:true});

/* ===== pregúntele al vendedor: problemas comunes ===== */
const PROBS=[
 {k:'manguera',h:'La manguera gotea o se zafa',a:/manguera/,b:[/gote|fuga|rota|pierde|zafa|suelta|chorre|no sirve|pegar|unir/],t:'Si gotea en la unión con la llave o con la pistola, casi siempre es el coplín o el empaque. Corte la parte dañada de la manguera y coloque un coplín o una unión nueva, bien apretada con abrazadera. En la rosca de la llave, una vuelta de cinta teflón ayuda.',r:[/^coplin/,/union para manguera/,/^abrazadera/,/cinta teflon/,/pistola para manguera/]},
 {k:'gas',h:'Huele a gas o la cocina de gas no prende',a:/\bgas\b|cilindro|cocina de gas/,b:[/fuga|olor|huele|no prende|no enciende|regulador|manguera|escapa/],t:'Si huele a gas: cierre la llave del cilindro, abra puertas y ventanas, y no encienda fósforos ni aparatos. Revise las uniones pasando agua con jabón: si salen burbujas, ahí está la fuga. Cambie la manguera si está reseca y el regulador si está dañado. Si el olor sigue, no use la cocina y pida ayuda.',r:[/^regulador/,/manguera para gas/,/^abrazadera/,/^encendedor/]},
 {k:'inodoro',h:'El inodoro no deja de llenar o pierde agua',a:/inodoro|sanitario|\btaza\b|tanque|servicio sanitario/,b:[/no (deja|para) de|sigue corriendo|se queda (corriendo|llenando)|corre el agua|pierde agua|no llena|no jala|no baja|gote|fuga|pera|boya/],t:'Si el agua sigue corriendo, casi siempre es la pera (el tapón del fondo del tanque) o la válvula de entrada. Cierre la llave de paso, vacíe el tanque y revise: si la pera está dura o deformada, cámbiela; si el agua no deja de entrar, cambie la válvula de entrada.',r:[/^pera|pera fama/,/valvula entrada/,/^tubo abasto.*inodoro|^tubo abasto/,/manija.*inodoro|^manija/]},
 {k:'inodorobase',h:'El inodoro se mueve o huele mal en la base',a:/inodoro|sanitario|\btaza\b/,b:[/base|piso|se mueve|baila|mal olor|\bolor|huele/],t:'Si el inodoro se mueve o sale mal olor de la base, hay que cambiar el empaque de cera. Cierre el agua, vacíe el tanque, quite el inodoro, limpie la cera vieja, coloque el empaque nuevo y vuelva a fijar el inodoro sin apretar de más para no quebrar la porcelana.',r:[/empaque.*(cera|inodoro)/,/^tubo abasto.*inodoro|^tubo abasto/,/^guante/]},
 {k:'tapado',h:'Se tapó un desagüe',a:/tap(o|ado|ada)|atasc|obstru|no baja el agua|no traga|se llena de agua|destaqu/,b:[/inodoro|lavatorio|fregadero|ducha|desague|caneria|tubo|pila/],t:'Primero use un destaqueador de hule: tape bien el desagüe y empuje con fuerza varias veces. Si no sale, use una sonda para destaquear y métala con cuidado, girándola. Use guantes y no mezcle productos químicos.',r:[/destaqueador/,/sonda para destaquear/,/^guante/]},
 {k:'fuga',h:'Una fuga de agua en llave o tubería',a:/fuga|gote|chorre|bota agua|sale agua|se sale el agua|escurre|filtra|(tubo|tuberia|pvc|caneria).*(quebr|rot|rajad|peg|unir)|(quebr|rot|rajad|peg|unir).*(tubo|tuberia|pvc|caneria)/,b:[/llave|tubo|rosca|abasto|lavatorio|fregadero|cachera|union|pvc|pila|agua/],t:'Primero cierre la llave de paso. Si gotea en una rosca, desármela, límpiela y póngale cinta teflón (5 o 6 vueltas en el sentido de las agujas del reloj). Si gotea el tubo de abasto, cámbielo por uno de la misma medida. Si es un tubo PVC quebrado, corte el pedazo y pegue una unión con pegamento para PVC.',r:[/cinta teflon/,/^tubo abasto/,/llave paso/,/pegamento para pvc/,/^union pvc lisa/],g:2},
 {k:'olor',h:'Mal olor en el fregadero o lavatorio',a:/(huele|olor|hiede|apesta).*(desague|fregadero|lavatorio|pila|ducha|cano|caneria|bano)|(desague|fregadero|lavatorio|pila|cano|caneria).*(huele|olor|hiede|apesta)/,b:[],t:'El mal olor casi siempre sale del sifón (la curva de tubo debajo del fregadero o lavatorio). Si casi no se usa, deje correr agua para que se llene. Si está sucio o roto, desármelo, lávelo o cámbielo por uno nuevo. Si además el agua baja lenta, destaquéelo.',r:[[/sifon cespol para fregadero/,/^sifon/],/destaqueador/,/cinta teflon/,/^guante/]},
 {k:'techo',h:'Gotera en el techo o humedad',a:/techo|gotera|lamina|zinc|canoa|humedad|se moja|entra (el )?agua|llueve adentro/,b:[/gote|filtra|moja|entra (el )?agua|llueve|humedad|tornillo|oxid|tapad|rot/],t:'Casi siempre el agua entra por un tornillo flojo, un traslape de lámina o una canoa tapada. Cambie los tornillos viejos por tornillos para techo y selle por encima con silicón. Limpie las canoas para que el agua corra. Si la lámina está picada, lo mejor es cambiarla. Suba con una escalera firme y nunca con el techo mojado.',r:[[/tornillo para techo punta broca 1\/4 x 1 1\/2/,/tornillo para techo/],[/silicon truper transparente/,/^silicon/],/pistola para silicon/,/escalera aluminio tipo tijera/,/^guante/]},
 {k:'breaker',h:'Se bota el breaker o se va la luz',a:/breaker|\btacos?\b|se va la luz|corto ?circuito|se fue la luz|sin (luz|corriente)|no hay (luz|corriente)/,b:[/se (bota|boto|salta|dispara|cae|cayo|baja)|cada rato|corto|chispa/],t:'Si el breaker se bota, desconecte los aparatos de ese circuito y súbalo de nuevo. Si se vuelve a botar sin nada conectado, puede haber un corto: no lo fuerce y llame a un electricista. Si se bota solo cuando conecta varios aparatos juntos, el circuito está sobrecargado.',r:[[/breaker cutler hammer ch 1 x 20 a$/,/^breaker/],/probador/,/tape electrico/]},
 {k:'toma',h:'Un tomacorriente o apagador no sirve',a:/\btomas?\b|enchufe|tomacorriente|apagador|interruptor/,b:[/no sirve|no da|no funciona|suelt|floj|chispa|quemad|cambiar|derretid|no enciende|no apaga/],t:'Apague el breaker y verifique con un probador que no hay corriente. Quite la tapa, revise que los cables estén bien apretados y sin partes quemadas. Si el tomacorriente o el apagador está quemado o flojo, cámbielo por uno nuevo.',r:[/^toma doble/,/^apagador sencillo/,/caja rectangular/,/probador/,/tape electrico/,/^desatornillador/],g:1},
 {k:'luz',h:'Un bombillo o lámpara no prende',a:/bombillo|\bluz\b|lampara|socket|foco|fluorescente/,b:[/no prende|no enciende|no da luz|fundi|quemad|parpadea|no sirve|se apago|no funciona/],t:'Pruebe primero con un bombillo que sí sirva. Si tampoco prende, revise el breaker y luego el socket o el apagador (siempre con la corriente apagada). Si cambia el bombillo, un LED gasta mucho menos y dura más.',r:[[/bombillo led aksi en caja 9 w/,/^bombillo led/],/^socket/,/^apagador sencillo/,/probador/]},
 {k:'cable',h:'Un cable pelado o un empalme',a:/cable|alambre electric|extension/,b:[/pelad|expuesto|rot|empalm|unir|conectar|cortad|quemad|derretid/],t:'Apague el breaker antes de tocarlo. Para un empalme, pele un poco cada punta, tuérzalas juntas o use un conector, y cubra bien con tape eléctrico estirándolo y traslapando cada vuelta. Si el cable está derretido o muy dañado, cámbielo completo.',r:[/tape electrico/,/^conector/,/^alicate/,/probador/]},
 {k:'tuerca',h:'Una tuerca o tornillo trabado',a:/trab|pegad|atascad|no (afloja|sale|gira|da vuelta)|muy apretad|barrid|redonde/,b:[/tuerca|tornillo|perno|rosca|pieza|bujia|llanta|rueda/],t:'Aplique WD-40, espere unos 5 minutos y vuelva a aplicar. Use una llave de la medida exacta (no la ajustable, que se resbala) y jale con fuerza pareja. Unos golpecitos con el martillo en la llave ayudan a soltarla. Si la cabeza ya está redondeada, use un extractor.',r:[/wd-40/,[/juego llaves corofijas/,/llave corofija/],/^juego (de )?cubos/,/^martillo/,/^guante/]},
 {k:'oxido',h:'Una pieza oxidada',a:/oxid|herrumbr|corrosi|sarro/,b:[/reja|porton|metal|hierro|herramienta|pieza|tornillo|mueble/],t:'Quite el óxido con cepillo de acero o lija, limpie el polvo y pinte con spray para proteger el metal. Para piezas que se mueven, WD-40 saca la humedad y evita que vuelvan a oxidarse.',r:[[/^cepillo.*acero/,/^cepillo/],[/lija de agua en pliego truper #120/,/lija de agua/],/pintura en spray 7fc/,/wd-40/,/^guante/]},
 {k:'rechina',h:'Una puerta o bisagra rechina',a:/rechin|chirri|chill|hace ruido|suena|cruje/,b:[/puerta|bisagra|porton|ventana|candado|cerradura|portón/],t:'Aplique WD-40 o aceite multiusos en el eje de la bisagra y abra y cierre la puerta varias veces. Si la bisagra está floja o gastada, apriete los tornillos o cámbiela.',r:[/wd-40/,/aceite 3 en 1|3 en 1/,/^bisagra/,/^desatornillador/]},
 {k:'cerradura',h:'La cerradura o el llavín no sirve',a:/cerradura|llavin|chapa|cerrojo|picaporte|candado|puerta.*no (cierra|abre|calza|ajusta)|puerta.*(arrastra|caid|descuadr)|perd\w* (la |las |mis )?llaves?\b/,b:[/no (cierra|abre|sirve|gira|entra)|trab|dura|perd|cambiar|forzad|robaron/],t:'Si la llave entra dura o el candado está trabado, aplique WD-40 y meta y saque la llave varias veces. Si la puerta se arrastra o no calza, apriete los tornillos de las bisagras o cámbielas. Si perdió la llave o la cerradura está dañada, lo más seguro es cambiar el llavín. Mida el grueso de la puerta antes de comprar.',r:[/^llavin|^cerradura/,/wd-40/,/^bisagra/,/^candado/,/^desatornillador/]},
 {k:'tv',h:'Colgar un televisor',a:/\btv\b|tele\b|televisor|pantalla/,b:[/colgar|guindar|pared|soporte|montar|poner|instalar/],t:'Use un soporte para TV de la medida de su pantalla y fíjelo a la pared con espander y tornillos (en concreto o bloque, con broca para concreto). Verifique con nivel antes de apretar. En gypsum, busque los perfiles o use anclas para gypsum de buena carga.',r:[/soporte para tv/,/^kraft brocas concreto|broca.*concreto/,[/espander plastico s-8/,/^espander plastico/],/^nivel/,/^taladro/]},
 {k:'gypsum',h:'Colgar algo o arreglar un hueco en gypsum',a:/gypsum|tablaroca|drywall|yeso/,b:[/colgar|fijar|guindar|hueco|roto|agujero|tornillo|ancla/],t:'En gypsum no sirve el espander plástico común: use anclas para gypsum, que se abren detrás de la lámina. Para cosas pesadas, atornille directo a los perfiles. Si hay un hueco pequeño, se tapa con masilla y una espátula.',r:[/espander para gypsum/,/tornillo para gypsum/,/^espatula/,/^taladro|^atornillador/]},
 {k:'colgar',h:'Colgar o fijar algo en la pared',a:/colgar|fijar|guindar|clavar|montar|poner|instalar|perfor|taladr|hueco|agujero/,b:[/pared|repisa|cuadro|espejo|gabinete|estante|soporte|concreto|bloque|block|columna|tapia/],t:'Marque con lápiz y verifique con nivel. Use una broca del mismo grosor que el espander, perfore un poco más profundo que el espander (en concreto o bloque con el taladro en percutor), limpie el polvo, meta el espander y atornille. Antes de perforar, revise que no pasen cables ni tubos.',r:[/^kraft brocas concreto|broca.*concreto/,/^espander plastico/,/^tornillo torfix/,/^nivel/,/percutor/],g:3},
 {k:'pintarpared',h:'Pintar una pared o un cuarto',a:/pint/,b:[/pared|cuarto|casa|cielo|techo|fachada|sala|habitacion/],t:'Proteja el piso y los marcos con masking, lije las partes ásperas y limpie el polvo. Pinte primero bordes y esquinas con brocha y después lo grande con rodillo. Dé dos manos, esperando el secado que indica el envase.',r:[/set para pinta con rodillo/,/^brocha/,/masking/,/^lija para madera/,/thinner/],g:0},
 {k:'pintarmetal',h:'Pintar metal, madera o retocar',a:/pint|spray/,b:[/metal|reja|porton|hierro|mueble|madera|moto|bicicleta|retoc|silla|carro/],t:'Lije la superficie, límpiela bien y proteja lo que no va a pintar con masking. Con spray, agite la lata 1 minuto y aplique a unos 25 o 30 cm en capas delgadas, varias manos.',r:[/pintura en spray 7fc/,[/lija de agua en pliego truper #120/,/lija de agua/],/masking/,/^respirador/,/^guante/]},
 {k:'silicon',h:'Sellar en el baño, la ducha o una ventana',a:/sell|silicon|junta|hongo|moho|filtra/,b:[/bano|ducha|lavatorio|fregadero|ventana|vidrio|tina|pared|techo|canoa/],t:'Quite el silicón viejo; si hay hongo, lávelo con agua y cloro y deje secar bien. Proteja los bordes con masking, aplique un cordón parejo de silicón y alíselo con el dedo mojado en agua con jabón. Quite el masking enseguida y deje secar el tiempo que indica el tubo.',r:[[/silicon truper transparente/,/silicon loctite 70 ml transparente/,/^silicon/],/pistola para silicon/,/masking/,/^espatula/]},
 {k:'cortarmetal',h:'Cortar metal o hierro',a:/cort|serrar/,b:[/metal|hierro|varilla|perfil|tubo|lamina|angular|tornillo|candado|cadena/],t:'Para cortes rápidos use esmeriladora con disco de corte para metal; para piezas pequeñas, una segueta. Use siempre anteojos y guantes, y la guarda de la esmeriladora puesta.',r:[/^esmeriladora/,/disco (de )?corte metal|disco corte metal/,/^segueta|marco para segueta|^sierra hoja/,/^anteojo/,/^guante/]},
 {k:'cortarpiso',h:'Cortar cerámica, piso o concreto',a:/cort/,b:[/ceramica|piso|azulejo|porcelanato|concreto|bloque|block|piedra/],t:'Para cerámica y porcelanato, una cortadora de piso da cortes rectos y limpios. Para concreto o bloque, use esmeriladora con disco diamante y respirador por el polvo.',r:[/cortadora de piso/,/disco diamante|disco corte concreto/,/^esmeriladora/,/^anteojo/,/respirador/]},
 {k:'monte',h:'Chapiar monte o podar',a:/monte|zacate|chapi|maleza|cesped|charral|podar|rama|arbol/,b:[],t:'Para chapiar, un cuchillo corneta bien afilado rinde mucho; mantenga el filo con una lima. Para ramas, use tijera de podar. Use guantes y botas.',r:[/cuchillo.*corneta|cuchillos corneta/,/^lima/,/tijera para (podar|ramas|jardin)/,/^guante/,/^bota/]},
 {k:'afilar',h:'Afilar un cuchillo o machete',a:/afilar|sin filo|no corta|desafil|perdio el filo|filo/,b:[],t:'Para machetes y cuchillos de campo use una lima, siempre en un solo sentido y desde el lomo hacia el filo. Para cuchillos de cocina, un afilador o una piedra de asentar dejan mejor filo.',r:[/^lima/,/afilador|piedra (para )?(afilar|asentar)/,/^guante/]},
 {k:'fumigar',h:'Fumigar o controlar plagas',a:/fumig|plaga|insect|zancud|hormig|cucarach|maleza/,b:[],t:'Use una bomba fumigadora y protéjase con respirador, anteojos y guantes. Fumigue sin viento y lave el equipo al terminar. Siga siempre las instrucciones del producto que va a aplicar.',r:[/bomba fumigadora/,/respirador/,/^anteojo/,/guante (de )?(latex|nitrilo)|^guante/]},
 {k:'ratones',h:'Hay ratones',a:/raton|rata|roedor/,b:[],t:'Coloque ratoneras en las orillas de las paredes y detrás de los muebles, que es por donde caminan. Revise y tape los huecos por donde puedan entrar.',r:[/ratonera/,/^guante/]},
 {k:'bateria',h:'El carro o la moto no arranca',a:/(carro|moto|auto|vehiculo|camion|pick ?up|bateria).*(no (arranca|prende|enciende)|descarg|muerta)|(no (arranca|prende|enciende)|descarg).*(carro|moto|auto|vehiculo|camion|bateria)/,b:[/bateria|arranc/],t:'Si la batería está descargada, use cables pasa corriente: positivo con positivo y negativo a una parte metálica del motor. Limpie los bornes si están sulfatados. Si no arranca después de eso, puede ser otra falla: llévelo al mecánico.',r:[/cables? pasa corriente|cable p\/bateria/,/^bornes/,/^linterna/,/^guante/]},
 {k:'llanta',h:'Una llanta ponchada o baja',a:/llanta|neumatico|ponch|pinch|desinfl|rueda/,b:[],t:'Si es un pinchazo pequeño, puede repararla con un kit de reparación de llantas o un sellador. Revise la presión con un medidor y use la que indica el carro (normalmente en la puerta del chofer).',r:[/kit de reparacion de llantas/,/sellador de llantas/,/medidor de presion/,/^inflador/,/^gata/]},
 {k:'aceite',h:'Cambiar o revisar el aceite',a:/aceite/,b:[/carro|moto|motor|cambiar|revisar|nivel|perdiendo|bajo/],t:'Revise el nivel con el motor frío y el vehículo en un lugar plano. Use la viscosidad que indica el manual. Un embudo evita derrames, y un desengrasante deja limpio el motor.',r:[/^aceite.*(sae|\dw-?\d)/,/^embudo/,/desengrasante/,/^guante/],g:5},
 {k:'grasa',h:'Limpiar grasa o cochambre',a:/grasa|cochambre|mancha|sucio|limpi|cochino/,b:[/cocina|motor|piso|carro|horno|estufa|campana|taller|pared/],t:'Rocíe desengrasante, déjelo actuar unos minutos y restriegue con esponja o paño. En superficies delicadas, pruebe primero en una parte que no se vea.',r:[[/desengrasante cocina/,/desengrasante/],/^atomizador/,/^esponja/,/^pano/,/^guante/]},
 {k:'soldar',h:'Soldar',a:/sold|electrodo/,b:[],t:'Nunca mire el arco sin máscara para soldar y use guantes de cuero largos. Limpie bien la pieza con cepillo de acero antes de soldar y trabaje en un lugar ventilado.',r:[/mascara (para )?soldar/,/guante.*soldar|guante de cuero/,/^soldadura/,/pinza (para )?tierra/,/cepillo.*acero/]},
 {k:'nivel',h:'Medir, nivelar o escuadrar',a:/nivel|desnivel|torcid|medir|plomo|escuadr|recto/,b:[],t:'Use nivel para lo horizontal y vertical, cinta métrica para medir y escuadra para los ángulos. Para tramos largos, una cuerda de albañil bien tensa le marca la línea.',r:[/^nivel/,/cinta metrica/,/^escuadra/,/cuerda (para )?albanil|tiralines/,/lapiz para carpintero/]},
 {k:'ducha',h:'La ducha no calienta o gotea',a:/ducha|regadera/,b:[/no calienta|fria|gote|cambiar|instalar|chispa|quemad/],t:'Si es una ducha eléctrica, apague el breaker antes de revisarla. Si gotea, revise la rosca y póngale cinta teflón; si la ducha no calienta o echa chispas, no la use y llame a un electricista o cámbiela por una nueva.',r:[/^ducha/,/^aspersion para ducha/,/cinta teflon/,/probador/]}];
function probMatch(txt){const t=' '+norm(txt).replace(/[^a-z0-9 ]+/g,' ')+' ';return PROBS.map(p=>{if(!p.a.test(t))return [0,p];let s=2;p.b.forEach(re=>{if(re.test(t))s+=2});return [s,p]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0])}
/* ===== pregúntele al vendedor: conversación ===== */
IC.chat='<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>';IC.send='<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>';
const CHATQ=['Gotea una llave','El inodoro no deja de llenar','Se bota el breaker','Quiero colgar la tele','La puerta rechina','Se tapó el desagüe','Quiero pintar un cuarto','El carro no arranca'];
const CHATSTOP=new Set('necesito ocupo ocupaba quiero queria quisiera busco buscando tienen tiene tienes tendran hay venden vende un una unos unas el la los las lo de del para me mi mis por favor porfa que cual cuanto cuanta cuesta cuestan vale valen precio precios comprar algo hola buenas buenos dias tardes noches se le les y o a con en al es son ustedes usted'.split(' '));
let chatLog=[],chatBusy=false;
const chatMob=()=>matchMedia('(max-width:760px)').matches;
const chatChips=(L,cls)=>`<div class="cchips">${L.map(q=>`<button type="button" data-chatq="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
function cRow(p){return `<li>${spr(p,'th')}<a href="#p-${p.id}" data-chatlink><b>${esc(p.t)}</b>${p.c?`<small>Cód. ${esc(p.c)}</small>`:''}</a>${cart[p.id]?`<button type="button" class="on" disabled>${ic('check','width:15px;height:15px')}Listo</button>`:`<button type="button" data-add="${p.id}">+ Agregar</button>`}</li>`}
function cProds(ids,noall){const L=ids.map(id=>BY.get(id)).filter(Boolean);if(!L.length)return '';const left=L.filter(p=>!cart[p.id]).length;
  return `<ul class="cprods">${L.map(cRow).join('')}</ul>${L.length>1&&!noall?(left?`<button class="btn acc call" type="button" data-chatall="${L.map(p=>p.id).join(',')}">${ic('plus')}Agregar todo (${left})</button>`:`<p class="cok">${ic('check','width:16px;height:16px')}Todo esto ya está en su carrito</p>`):''}`}
function cMsg(m){
  if(m.u!==undefined)return `<div class="cm u"><p>${esc(m.u)}</p></div>`;
  let h='';
  if(m.b==='hi')h=`<p><b>¡Hola! Soy el vendedor de Distribuidora C y M.</b></p><p>Cuénteme qué problema tiene o qué quiere hacer, como me lo diría en el mostrador, y le digo cómo resolverlo y qué llevar.</p>${chatChips(CHATQ)}`;
  else if(m.b==='pd'){const p=BY.get(m.id);const L=p?complements(p,3):[];h=`<p>Veo que está viendo <b>${esc(p?p.t:'')}</b>. ¿Para qué lo va a usar? Cuénteme y le digo qué más le conviene llevar.</p>${L.length?`<p class="cl">Lo que más se lleva con este producto:</p>${cProds(L.map(x=>x.id))}`:''}`}
  else if(m.b==='ans'){const p=PROBS.find(x=>x.k===m.k);
    h=`<p class="ch">${esc(p.h)}</p><p>${esc(p.t)}</p>${m.ids.length?`<p class="cl">Esto es lo que le recomiendo llevar:</p>${cProds(m.ids)}`:''}${m.price?`<p class="cnote">${ic('tag','width:15px;height:15px')}El precio se lo confirmamos con su pedido, junto con la disponibilidad.</p>`:''}${p.g!==undefined?`<a class="glink" href="#guia-${p.g}" data-chatlink>Ver la guía paso a paso ›</a>`:''}${m.alts&&m.alts.length?`<p class="cl">¿O se refiere a…?</p><div class="cchips">${m.alts.map(k=>{const a=PROBS.find(x=>x.k===k);return `<button type="button" data-chatk="${k}">${esc(a.h)}</button>`}).join('')}</div>`:''}`}
  else if(m.b==='srch')h=`<p>${m.price?'El precio se lo confirmamos con su pedido, junto con la disponibilidad. ':''}Esto es lo que encontré en el catálogo${m.fixed?` para “${esc(m.fixed)}”`:''}:</p>${cProds(m.ids,1)}${m.n>m.ids.length?`<button class="lnk cmore" type="button" data-chatsrch="${esc(m.q)}">Ver los ${fmt(m.n)} resultados ›</button>`:''}${(()=>{const p=BY.get(m.ids[0]);const L=p?complements(p,3):[];return L.length?`<p class="cl">Con esto también se suele llevar:</p>${cProds(L.map(x=>x.id),1)}`:''})()}<p class="cl">¿Para qué lo necesita? Si me cuenta, le digo qué más le puede servir.</p>`;
  else if(m.b==='none')h=`<p>Disculpe, no le entendí bien. Cuénteme con otras palabras qué le pasa o qué quiere hacer, por ejemplo: “gotea el tubo del lavatorio” o “quiero colgar una repisa”.</p><p>También puede usar el <a href="#asesor" data-chatlink>Asesor de compras</a> o llamarnos al ${esc(STORE.telefono)}.</p>${chatChips(CHATQ.slice(0,4))}`;
  else if(m.b==='txt')h=m.h;
  return `<div class="cm b">${h}</div>`}
function chatCount(){const el=$('#ccount');if(el)el.textContent=totals().units}
function chatRender(keep){const b=$('#cbody');if(!b)return;const top=b.scrollTop;b.innerHTML=chatLog.map(cMsg).join('')+(chatBusy?'<div class="cm b ctyping" aria-label="Escribiendo"><span></span><span></span><span></span></div>':'');chatCount();if(keep)b.scrollTop=top}
function chatScroll(){const b=$('#cbody');if(!b)return;const L=b.querySelectorAll('.cm');const last=L[L.length-1];if(!last)return;const prev=L[L.length-2];
  const target=(prev&&prev.classList.contains('u')?prev:last).offsetTop-10;b.scrollTop=Math.min(target,b.scrollHeight)}
function chatOpen(q){const c=$('#chat');hideAdded();toggleMega(false);closeSuggest();
  if(!chatLog.length)chatLog.push({b:'hi'});
  const m=location.hash.match(/^#p-(\d+)/);if(m&&!q){const id=+m[1];const last=chatLog[chatLog.length-1];if(!(last.b==='pd'&&last.id===id))chatLog.push({b:'pd',id})}
  c.classList.add('open');c.setAttribute('aria-hidden','false');document.body.classList.add('chatopen');if(chatMob())document.body.style.overflow='hidden';
  chatRender();chatScroll();if(q)chatAsk(q);else if(!chatMob())setTimeout(()=>$('#cin').focus(),60)}
function chatClose(){const c=$('#chat');c.classList.remove('open');c.setAttribute('aria-hidden','true');document.body.classList.remove('chatopen');if(!$('#ov').classList.contains('open'))document.body.style.overflow=''}
function chatReply(txt){const n=norm(txt).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();const w=n.split(' ').filter(Boolean);
  const price=/precio|cuanto (cuesta|vale|sale|cobran)|\bcosto\b|\bvalor\b/.test(n);
  if(w.length<=4&&/^(muchas )?gracias|^(ok|okay|listo|perfecto|muy bien|vale|excelente|pura vida|genial|bueno)$/.test(n))return {b:'txt',h:`<p>¡Con mucho gusto! ¿Le ayudo con algo más?</p>${totals().units?`<button class="btn call" type="button" data-opencart>Ver mi carrito (${totals().units})</button>`:''}${chatChips(CHATQ.slice(4))}`};
  if(w.length<=3&&/^(hola|buenas|buenos dias|buenas tardes|buenas noches|hey|saludos|ola|upe)\b/.test(n))return {b:'txt',h:`<p>¡Hola! ¿En qué le puedo ayudar? Cuénteme qué le pasa o qué quiere hacer.</p>${chatChips(CHATQ)}`};
  const R=probMatch(txt);
  if(R.length){const top=R[0];const alts=R.slice(1).filter(x=>x[0]>=Math.min(4,top[0])).slice(0,2).map(x=>x[1].k);return {b:'ans',k:top[1].k,ids:advPicks(top[1],ADVUSE[2]).map(p=>p.id),alts,price}}
  if(/envio|envian|entrega|domicilio|horario|abren|cierran|direccion|donde (estan|quedan|queda)|ubicacion|telefono|whatsapp|como (pido|compro|hago el pedido)|pagar|pago/.test(n))return {b:'txt',h:`<p><b>Así funciona su pedido:</b> agregue lo que necesita al carrito y envíe el pedido. Nosotros le confirmamos el precio, la disponibilidad y la entrega. No tiene que pagar en línea.</p><p>${ic('truck','width:15px;height:15px')} Envío gratis en pedidos desde ₡110.000.</p><p><b>Entregas:</b> ${esc(STORE.entregas)}<br><b>Horario:</b> ${esc(STORE.horario)}<br><b>Dirección:</b> ${esc(STORE.direccion)}<br><b>Teléfono:</b> ${esc(STORE.telefono)}</p>${totals().units?`<button class="btn acc call" type="button" data-opencart>Ver mi carrito (${totals().units})</button>`:''}`};
  const q=w.filter(x=>!CHATSTOP.has(x)).join(' ');const S2=q?searchSmart(q):{list:[]};
  if(S2.list.length)return {b:'srch',q:S2.fixed||q,fixed:S2.fixed,ids:onePerFamily(S2.list,4).map(p=>p.id),n:S2.list.length,price};
  return {b:'none'}}
function chatAsk(txt,k){txt=String(txt||'').trim();if(!txt||chatBusy)return;chatLog.push({u:txt});chatBusy=true;chatRender();chatScroll();
  const m=k?(()=>{const p=PROBS.find(x=>x.k===k);return {b:'ans',k,ids:advPicks(p,ADVUSE[2]).map(x=>x.id),alts:[]}})():chatReply(txt);
  setTimeout(()=>{chatBusy=false;chatLog.push(m);if(chatLog.length>60)chatLog=chatLog.slice(-60);chatRender();chatScroll()},450)}
function chatAll(ids){const L=ids.split(',').map(Number).filter(id=>BY.has(id)&&!cart[id]);L.forEach(id=>{cart[id]=1});saveCart(true);L.forEach(id=>refresh(id));chatRender(true);
  chatLog.push({b:'txt',h:`<p>${ic('check','width:16px;height:16px')} <b>Listo, le agregué ${L.length} producto${L.length===1?'':'s'} al carrito.</b> ¿Le ayudo con algo más?</p><button class="btn call" type="button" data-opencart>Ver mi carrito (${totals().units})</button>`});chatRender();chatScroll()}
function chatHome(){return `<section class="wrap blk" aria-labelledby="h-chat"><div class="chome"><div class="ct"><span class="pill">${ic('chat','width:15px;height:15px')} Pregúntele al vendedor</span><h2 id="h-chat" class="disp">¿Qué problema tiene?</h2><p>Escríbalo como se lo diría al vendedor. Le respondemos qué hacer y qué llevar.</p></div>
  <div class="cf"><form class="chform" id="hchat" autocomplete="off"><label class="vh" for="hcin">Escriba su problema</label><input id="hcin" type="text" placeholder="Ej.: se me gotea la llave del lavatorio" maxlength="200"><button class="btn acc" type="submit">Preguntar</button></form>${chatChips(CHATQ.slice(0,6))}</div></div></section>`}
function askPD(p){return `<button class="askpd" type="button" data-chatopen>${ic('chat')}<span><b>¿Tiene dudas con este producto?</b><small>Pregúntele al vendedor qué más necesita para su trabajo.</small></span>${ic('right','width:18px;height:18px')}</button>`}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
  if('chatopen' in d||d.tab==='chat'){e.preventDefault();chatOpen();return}
  if('chatclose' in d){chatClose();return}
  if(d.chatq!==undefined){if(!$('#chat').classList.contains('open'))chatOpen(d.chatq);else chatAsk(d.chatq);return}
  if(d.chatk){const p=PROBS.find(x=>x.k===d.chatk);p&&chatAsk(p.h,p.k);return}
  if(d.chatall){chatAll(d.chatall);return}
  if(d.chatsrch!==undefined){$('#q').value=d.chatsrch;if(chatMob())chatClose();doSearch();return}
  if('chatlink' in d&&chatMob()){chatClose();return}});
document.addEventListener('submit',e=>{if(e.target.id==='cform'){e.preventDefault();const i=$('#cin');const v=i.value;i.value='';chatAsk(v);return}
  if(e.target.id==='hchat'){e.preventDefault();const i=$('#hcin');const v=i.value.trim();i.value='';chatOpen(v||undefined);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#chat').classList.contains('open')&&!$('#ov').classList.contains('open'))chatClose()});

/* ===== flecha para volver ===== */
let navD=0;try{const st=history.state;if(st&&typeof st.cymd==='number')navD=st.cymd;else history.replaceState({cymd:0},'')}catch(e){}
addEventListener('hashchange',()=>{try{const st=history.state;if(st&&typeof st.cymd==='number')navD=st.cymd;else{navD++;history.replaceState({cymd:navD},'')}}catch(e){navD++}});
const BACKTO={guia:'#guias',negocio:'#negocio',surtido:'#surtidos',asesor:'#inicio'};
function goBack(){if(navD>0){history.back();return}const h=location.hash;let f='#inicio';const m=h.match(/^#p-(\d+)/);
  if(m){const p=BY.get(+m[1]);if(p)f='#c-'+p.k}else{const k=h.slice(1).split('-')[0];if(BACKTO[k]&&h.includes('-'))f=BACKTO[k]}
  location.hash=f}
function backState(){const h=location.hash;document.body.classList.toggle('inner',!!h&&h!=='#'&&h!=='#inicio')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-back]');if(!t)return;e.preventDefault();goBack()});
new MutationObserver(backState).observe($('#view'),{childList:true});

renderMega();renderFooter();saveCart();rotatePromo();setInterval(rotatePromo,5000);lastHash=location.hash;route();cartWait();
