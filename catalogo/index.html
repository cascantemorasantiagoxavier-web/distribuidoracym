 return `<article class="it" id="it-${pid}" data-pid="${pid}" style="--t:${tint(col,.16)};--cc:${cc}">${ph}<div>${sl}${c.b?`<div class="wbr">${e(c.b)}</div>`:''}<h3>${e(c.t)}</h3>${c.d?`<p class="ds">${e(c.d)}</p>`:''}${cods}<a class="pg" href="#p${c.pg}">Página ${c.pg} en la revista</a></div></article>`}
function cardsOf(k){return ST.SUBS[k].flatMap(sb=>ST.byKey.get(k+'|'+sb)||[])}
function tilesHTML(){return '<div class="wtiles">'+ST.order.map(k=>{const cl=cardsOf(k);const n=cl.reduce((a,c)=>a+c.L.length,0);const pic=(cl.find(c=>c.im&&c.q)||cl.find(c=>c.im)||{}).im;
 return `<a class="wtile" href="#s-${e(k)}" style="background:${tint(ST.COL[k],.16)};--c:${ST.COL[k]}">${pic?`<img src="${e(pic)}" alt="" loading="lazy">`:'<span class="ni"></span>'}<b>${e(ST.LABEL[k])}</b><small>${n} productos</small></a>`}).join('')+'</div>'}
const FOOT=()=>`<footer class="wfoot wrap">Distribuidora C y M. Catálogo ${YEAR}. <a href="../index.html">Ir a la tienda en línea</a></footer>`;
function viewHome(){return `<section class="hero"><div class="in"><h1>Catálogo<span>${YEAR}</span></h1>
<p>${fmtN(ST.NPROD)} productos de ferretería con su código. Búsquelo arriba o entre por sección.</p>
<div class="acts"><a class="btn am" href="#revista">Hojear la revista</a><button type="button" class="btn ln" data-pdf>Descargar PDF</button></div></div>
<img class="tool" src="cut/c1161.png" alt=""><div class="hz"></div></section>
<div class="wrap"><h2 class="ttl">Secciones</h2><p class="sub">${ST.order.length} secciones, en el mismo orden de la revista.</p>${tilesHTML()}
<div class="how"><p><b>Busque el producto</b> por nombre, código, marca o sección.</p><p><b>Anote el código</b> de la medida que necesita.</p><p><b>Páselo a su vendedor</b> o pídalo en la <a href="../index.html">tienda en línea</a>.</p></div></div>${FOOT()}`}
function viewSec(k){const col=ST.COL[k],on=oncol(col),i=ST.order.indexOf(k);
 const subs=ST.SUBS[k].filter(sb=>(ST.byKey.get(k+'|'+sb)||[]).length);const n=cardsOf(k).reduce((a,c)=>a+c.L.length,0);
 let h=`<section class="sband" style="background:${col};color:${on}"><div class="wrap" style="padding:0"><a class="wback" href="#" style="color:${on}">← Todas las secciones</a><h1>${e(ST.LABEL[k])}</h1><p>${n} productos. En la revista desde la página ${ST.toc[i][2]}.</p></div></section>`;
 if(subs.length>1)h+=`<nav class="wchips" aria-label="Partes de esta sección">${subs.map((sb,j)=>`<a href="#s-${e(k)}" data-g="${j}">${e(sb)}</a>`).join('')}</nav>`;
 h+='<div class="wrap">'+subs.map((sb,j)=>{const cl=ST.byKey.get(k+'|'+sb);const m=cl.reduce((a,c)=>a+c.L.length,0);
  return `<section class="grp" id="g-${j}" style="--c:${col}"><h2>${e(sb)} <small>${m}</small></h2><div class="list">${cl.map(c=>SMAP.get(c)).filter(Boolean).map(x=>itemHTML(x)).join('')}</div></section>`}).join('');
 const pv=ST.order[i-1],nx=ST.order[i+1];
 h+=`<nav class="nav2">${pv?`<a href="#s-${e(pv)}">Sección anterior<b>${e(ST.LABEL[pv])}</b></a>`:''}${nx?`<a class="n" href="#s-${e(nx)}">Sección siguiente<b>${e(ST.LABEL[nx])}</b></a>`:''}</nav></div>`+FOOT();
 return h}
function viewSearch(raw){const {res,parecidos}=searchItems(raw);let h='<div class="wrap">';
 if(!res.length)return h+`<div class="rhead"><h1>No encontramos “${e(raw)}”</h1></div><div class="empty"><p>Pruebe con otra palabra, con la marca o con el código.</p><p>También puede entrar por sección:</p></div>${tilesHTML()}</div>`;
 h+=`<div class="rhead"><h1>${parecidos?`Productos parecidos a “${e(raw)}”`:`${res.length} resultado${res.length===1?'':'s'} para “${e(raw)}”`}</h1>${res.length>80?'<p>Se muestran los primeros 80. Escriba otra palabra para afinar la búsqueda.</p>':''}</div>`;
 return h+'<div class="list">'+res.slice(0,80).map(([sc,x,hits])=>itemHTML(x,{hits,sec:1})).join('')+'</div></div>'+FOOT()}
let CUR={v:'',sec:''},PEND=null,RENDERED=false;
function fitCards(){document.querySelectorAll('#book .c9:not([data-fit])').forEach(c=>{const bd=c.querySelector('.bd');if(!bd||!bd.clientHeight)return;c.dataset.fit='1';const ph=c.querySelector('.ph'),tb=c.querySelector('.tb9');const wide=c.classList.contains('w2')||c.classList.contains('w3');let g=0;
 const bad=()=>bd.scrollHeight>bd.clientHeight+1;
 while(bad()&&g<14){g++;if(!wide&&ph&&ph.offsetHeight>64)ph.style.height=Math.max(64,ph.offsetHeight-14)+'px';else if(tb){const f=parseFloat(getComputedStyle(tb).fontSize);if(f>8)tb.style.fontSize=(f-0.5)+'px';else break}else break}})}
function alignRows(){document.querySelectorAll('#book .g9').forEach(g=>{const rows=new Map();[...g.children].forEach(c=>{if(!c.classList.contains('c9')||c.classList.contains('w2')||c.classList.contains('w3'))return;const ph=c.querySelector('.ph');if(!ph||ph.classList.contains('sw9'))return;const k=Math.round(c.getBoundingClientRect().top/6);(rows.get(k)||rows.set(k,[]).get(k)).push(ph)});rows.forEach(L=>{if(L.length<2)return;const m=Math.min(...L.map(p=>p.offsetHeight));L.forEach(p=>{if(p.offsetHeight>m)p.style.height=m+'px'})})})}
function show(v){document.getElementById('web').hidden=v==='rev';document.getElementById('rev').hidden=v!=='rev';CUR.v=v;if(v==='rev')requestAnimationFrame(()=>{fitCards();alignRows();setTimeout(()=>{fitCards();alignRows()},400)})}
function route(soft,keep){if(!ST)return;setHH();SMAP=new Map(SIDX.map(x=>[x.c,x]));const raw=cq.value.trim();cqx.hidden=!raw;
 const web=document.getElementById('web'),y=scrollY;
 if(raw){web.innerHTML=viewSearch(raw);show('web');CUR.sec='';scrollTo(0,soft?y:0);return}
 const h=decodeURIComponent(location.hash.slice(1));
 if(h==='revista'||/^p\d+$/.test(h)){show('rev');CUR.sec='';fit();
  if(soft){if(keep)goPage(keep,true)}else if(h==='revista')scrollTo(0,0);else requestAnimationFrame(()=>goPage(h));return}
 const k=h.startsWith('s-')?h.slice(2):'';
 if(k&&ST.order.includes(k)){web.innerHTML=viewSec(k);CUR.sec=k}else{web.innerHTML=viewHome();CUR.sec=''}

 if(soft){scrollTo(0,y);return}
 if(PEND){const el=document.getElementById('it-'+PEND);PEND=null;if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');return}}
 scrollTo(0,0)}

 if(cq.value){cq.value='';if(href===(location.hash||'#')||(href==='#'&&!location.hash)){ev.preventDefault();route()}return}
 if(href===(location.hash||'#')||(href==='#'&&!location.hash)){ev.preventDefault();route()}});

 let b=WEBP&&WEBP.get(id);if(!b){const c=W.cards.find(c=>c.L.some(x=>x[0]===id));if(!c)return null;const x=c.L.find(x=>x[0]===id);b={id,c:x[1],t:c.L.length===1?c.t:(c.t+' '+x[2]).trim(),d:c.d||'',pr:0,m:''}}

 render()};
