<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración · Distribuidora C y M</title>
<link rel="icon" href="logo.webp">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f3ec;color:#111;font-size:16px}
header{background:#111;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{height:38px;background:#fff;border-radius:8px;padding:2px 6px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:#333;color:#fff;border:0;border-radius:10px;height:40px;padding:0 12px;font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.login{max-width:420px;margin:8vh auto}
label{display:block;font-weight:700;margin:10px 0 5px}
input,select,textarea{width:100%;height:48px;border:1.5px solid #ccc;border-radius:11px;padding:0 12px;font-size:16px;font-family:inherit;background:#fff}
.go{width:100%;height:52px;border:0;border-radius:12px;background:#ffc400;font-weight:800;font-size:17px;margin-top:14px}
.msg{min-height:22px;margin-top:10px;font-weight:600;color:#b00020}
.tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{height:44px;border:0;border-radius:22px;padding:0 16px;font-weight:700;background:#e8e4da}
.tabs button.on{background:#111;color:#fff}
.tabs .n{display:inline-block;min-width:22px;border-radius:11px;background:#ffc400;color:#111;margin-left:6px;padding:0 6px;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.ord{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:6px solid #ccc}
.ord.nuevo{border-left-color:#ffc400}.ord.confirmado,.ord.listo{border-left-color:#3b82f6}.ord.entregado{border-left-color:#16a34a}.ord.cancelado{border-left-color:#dc2626;opacity:.75}
.ord .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ord h3{margin:0;font-size:18px}
.ord small{color:#555}
.ord .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ord .acts a,.ord .acts button{height:42px;display:inline-flex;align-items:center;border-radius:10px;padding:0 12px;font-weight:700;text-decoration:none;border:0;background:#eee;color:#111}
.ord .acts .wa{background:#1fa855;color:#fff}
.ord select{width:auto;height:42px;font-weight:700}
.ord ul{margin:8px 0 0;padding-left:20px}
.ord li{margin:3px 0}
.ord .code{color:#666;font-size:13px}
.cli{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.cli .sw{display:flex;align-items:center;gap:8px;font-weight:700}
.cli input[type=checkbox]{width:26px;height:26px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700;background:#fff4c2}
.pill.at{background:#dff3e4}.pill.aterr{background:#fde2e2}
.empty{padding:30px;text-align:center;color:#555}
.search{margin-bottom:10px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.sum div{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sum b{display:block;font-size:20px}.sum small{color:#555;font-size:13px}
.tools{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}.tools input{flex:1;min-width:200px}
.tools button{height:48px;border:0;border-radius:11px;padding:0 14px;font-weight:700;background:#111;color:#fff}
.tot{font-weight:800}
@media (max-width:640px){.sum{grid-template-columns:repeat(2,1fr)}}
.hint{color:#444;margin:0 0 10px}
.openb{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}.go2{flex:1;min-width:150px;display:flex;align-items:center;justify-content:center;height:54px;border-radius:12px;background:#ffc400;color:#111;font-weight:800;font-size:16px;text-decoration:none}.go2.dk{background:#111;color:#fff}
.plist{display:flex;flex-direction:column;gap:8px}.sub{margin:6px 0;font-size:16px}
.prow{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:0;border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);font:inherit;color:inherit;width:100%}
.prow .pt{flex:1;min-width:0}.prow b{display:block;font-size:15px}.prow small{display:block;color:#555;margin:2px 0 4px}
.th{flex:0 0 auto;width:72px;height:72px;border-radius:10px;background-color:#fff;background-repeat:no-repeat;background-position:center;border:1px solid #eee;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#888}
.th.big{width:100%;height:auto;aspect-ratio:1/1;max-width:360px}
.fed{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;overflow:auto;padding:12px}
.fbox{background:#fff;border-radius:18px;max-width:520px;margin:0 auto;padding:16px}
.fhead{display:flex;justify-content:space-between;align-items:center;font-size:18px}.fhead button{border:0;background:#eee;border-radius:20px;width:40px;height:40px;font-size:18px}
.fwrap{display:flex;justify-content:center}#fcv{width:100%;max-width:360px;aspect-ratio:1/1;border:2px dashed #ccc;border-radius:12px;touch-action:none;background:#fff}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 14px;border-radius:12px;background:#eee;border:0;font-weight:700;font-size:15px;color:#111;cursor:pointer;flex:1}
.btn2.warn{background:#fde2e2;width:100%;margin-bottom:6px}
#fz{height:36px;padding:0;border:0}.chk{display:flex;gap:10px;align-items:center;font-weight:700;margin-top:14px}.chk input{width:24px;height:24px}
textarea{height:auto;padding:10px 12px}
.ctog{display:flex;gap:6px;margin:0 0 10px;background:#eee;border-radius:12px;padding:4px}.ctog button{flex:1;min-height:44px;padding:0 4px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px}.ctog button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pill.ok{background:#e3f6e8;color:#0a7a2f}.pill.gray{background:#eee;color:#555}

.apar{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}@media(max-width:900px){.apar{grid-template-columns:1fr}}
.apar h3{margin:0 0 8px;font-size:16px}.apar .cr{display:flex;align-items:center;gap:10px;margin:7px 0}.apar .cr input[type=color]{width:46px;height:36px;border:1px solid #ccc;border-radius:8px;padding:2px;background:#fff}.apar .cr span{flex:1;font-size:14px}.apar select{width:100%;height:40px;border:1px solid #ccc;border-radius:8px;padding:0 8px;margin:4px 0 10px}
.apar iframe{width:100%;height:620px;border:1px solid #d6d2c6;border-radius:12px;background:#fff}.apar .insp input[type=text],.apar .insp input:not([type]){box-sizing:border-box}.apar .tl{font-size:13px;display:flex;gap:6px;align-items:center;border-top:1px solid #eee;padding:6px 0}.apar .tl b{flex:1;word-break:break-word}.apar .tl button{border:0;background:#eee;border-radius:8px;height:28px;padding:0 8px}
.apar .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.apar .bar button{height:44px;border:0;border-radius:22px;padding:0 18px;font-weight:700}.apar .bar .go{background:#1B4079;color:#fff}.apar .bar .gr{background:#e8e4da}
</style>
</head>
<body>
<header><img src="logo.webp" alt="C y M"><h1>Administración</h1><button id="out" hidden>Salir</button></header>
<main id="app"><div class="card login"><p>Cargando…</p></div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,getDocs,updateDoc,setDoc,deleteDoc,deleteField,collection,query,orderBy,limit,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const CFG={"apiKey": "AIzaSyD9cadZeJCAz29qe_hhpx3fH6mZQU08DYU", "authDomain": "distribuidora-cym.firebaseapp.com", "projectId": "distribuidora-cym", "storageBucket": "distribuidora-cym.firebasestorage.app", "messagingSenderId": "321804284441", "appId": "1:321804284441:web:f2006ed7721c54e09d7088"};
const app=initializeApp(CFG);const auth=getAuth(app);auth.languageCode='es';const db=getFirestore(app);
const $=s=>document.querySelector(s);const A=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EST={nuevo:'Nuevo',confirmado:'Confirmado',listo:'Listo para entregar',entregado:'Entregado',cancelado:'Cancelado'};
let tab='nuevo',vivos=[],ords=[],clis=[],unsub=[],firstLoad=true,known=new Set(),filtro='';
function loginView(msg){A.innerHTML=`<div class="card login"><h2 style="margin:0 0 6px">Ingresar</h2><p style="margin:0;color:#555">Solo para la administración de la tienda.</p>
 <form id="lf"><label for="m">Correo</label><input id="m" type="email" autocomplete="email" required><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
 <button class="go">Ingresar</button><div class="msg" id="lm">${esc(msg||'')}</div></form><button id="olv" style="background:none;border:0;text-decoration:underline;font-weight:600;margin-top:8px;padding:8px 0">¿Olvidó su contraseña?</button></div>`;
 $('#lf').addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#m').value.trim(),$('#p').value)}catch(er){$('#lm').textContent='Correo o contraseña incorrectos.'}});
 $('#olv').addEventListener('click',async()=>{const m=$('#m').value.trim();if(!m){$('#lm').textContent='Escriba su correo arriba.';return}try{await sendPasswordResetEmail(auth,m);$('#lm').style.color='#0a7a2f';$('#lm').textContent='Le enviamos un correo para cambiar la contraseña.'}catch(e){$('#lm').textContent='No se pudo enviar el correo.'}})}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,0.25].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.18)})}catch(e){}}
function tel8(s){return String(s||'').replace(/\D/g,'')}
function wa(t,txt){const n=tel8(t);if(n.length<8)return null;return 'https://wa.me/'+(n.length===8?'506'+n:n)+(txt?'?text='+encodeURIComponent(txt):'')}
function oText(o){const L=[`PEDIDO ${o.num}`,`Fecha: ${o.fecha}`,`Cliente: ${o.cliente?.nombre}`,`Teléfono: ${o.cliente?.tel}`];if(o.cliente?.negocio)L.push(`Negocio: ${o.cliente.negocio}`);L.push(`Entrega: ${o.entrega==='envio'?'Envío — '+(o.dir||''):'Retiro en el local'}`);if(o.notas)L.push(`Notas: ${o.notas}`);L.push('','Productos:');(o.items||[]).forEach(x=>L.push(`- ${x.q} × ${x.n}${x.c?' (Cód. '+x.c+')':''}${x.m?' Mod. '+x.m:''}${x.pr?' — '+crc(x.pr*x.q):''}`));L.push('',`Total de unidades: ${o.unidades}`);if(oTot(o))L.push(`Total aproximado: ${crc(oTot(o))} (IVA incluido)`);return L.join('\n')}
const numCR=v=>{let s=String(v||'').replace(/[^\d.,]/g,'');if(!s)return NaN;const ld=Math.max(s.lastIndexOf('.'),s.lastIndexOf(','));if(ld>=0){const dec=s.slice(ld+1),int=s.slice(0,ld).replace(/[.,]/g,'');if(dec.length===3&&!/[.,]/.test(s.slice(0,ld))&&s[ld]==='.'&&int.length<=3)return parseFloat(int+dec);if(dec.length===3&&/[.,]/.test(s.slice(0,ld)))return parseFloat(int+dec);return parseFloat(int+'.'+dec)}return parseFloat(s)};
const crc=n=>'₡'+(Math.round(n*100)/100).toLocaleString('es-CR',{minimumFractionDigits:0,maximumFractionDigits:2});
const oTot=o=>(o.items||[]).reduce((a,x)=>a+(x.pr||0)*(x.q||0),0);
const oDate=o=>o.creado&&o.creado.seconds?new Date(o.creado.seconds*1000):null;
const sameDay=(a,b)=>a&&a.toDateString()===b.toDateString();
let ofil='';
function csvExport(L){const rows=[['Fecha','Pedido','Cliente','Teléfono','Negocio','Entrega','Dirección','Estado','Código','Producto','Cantidad','Precio','Total línea']];L.forEach(o=>(o.items||[]).forEach(x=>rows.push([o.fecha||'',o.num||'',o.cliente?.nombre||'',o.cliente?.tel||'',o.cliente?.negocio||'',o.entrega==='envio'?'Envío':'Retiro',o.dir||'',EST[o.estado]||o.estado||'',x.c||'',x.n||'',x.q||0,x.pr?String(Math.round(x.pr*100)/100).replace('.',','):'',x.pr?String(Math.round(x.pr*x.q*100)/100).replace('.',','):''])));const csv='\ufeff'+rows.map(r=>r.map(v=>{v=String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='pedidos_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function atPill(a){if(!a)return '';if(a.estado==='ok')return `<span class="pill at">ApliTeam: Cotización ${esc(a.cot||'')}${a.sinCodigo?' · '+esc(a.sinCodigo)+' sin código':''}</span>`;if(a.estado==='error')return `<span class="pill aterr" title="${esc(a.msg||'')}">ApliTeam: no se pudo pasar</span>`;return '<span class="pill">Pasando a ApliTeam…</span>'}
function render(){const cnt=k=>ords.filter(o=>k==='todos'||(k==='proceso'?['confirmado','listo'].includes(o.estado):o.estado===k)).length;
 const nn=cnt('nuevo');document.title=(nn?`(${nn}) `:'')+'Administración · C y M';
 const actv=v=>{const d=v.actualizado&&v.actualizado.seconds?v.actualizado.seconds*1000:0;return Date.now()-d<15*60000};const nv=vivos.filter(actv).length;const T=[['envivo','En vivo'],['nuevo','Nuevos'],['proceso','En proceso'],['entregado','Entregados'],['todos','Todos'],['clientes','Clientes'],['productos','Editar productos'],['tienda','Datos de la tienda'],['apariencia','Apariencia'],['estado','Estado de la página']];
 let h=`<div class="tabs">${T.map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}${k==='envivo'?(nv?`<span class="n">${nv}</span>`:''):k==='clientes'?(clis.filter(c=>c.solicitaMayoreo&&!c.mayoreo).length?`<span class="n">${clis.filter(c=>c.solicitaMayoreo&&!c.mayoreo).length}</span>`:''):(cnt(k)&&k!=='todos'&&k!=='entregado'?`<span class="n">${cnt(k)}</span>`:'')}</button>`).join('')}</div>`;
 if(tab==='estado'){if($('#estwrap')){const tb=A.querySelector('.tabs');if(tb)tb.outerHTML=h;return}A.innerHTML=h+'<div id="estwrap"></div>';estCorrer();return}
 if(tab==='apariencia'){if($('#aparwrap')){const tb=A.querySelector('.tabs');if(tb)tb.outerHTML=h;return}A.innerHTML=h+aparPanel();aparInit();return}
 if(tab==='productos'||tab==='tienda'){const ex=$('#edwrap');if(ex&&ex.dataset.t===tab){const tb=A.querySelector('.tabs');if(tb)tb.outerHTML=h;return}A.innerHTML=h+(tab==='productos'?prodPanel():tiendaPanel());if(tab==='productos')prodInit();else tiendaInit();return}
 if(tab==='envivo'){const L=vivos.slice().sort((a,b)=>((b.actualizado&&b.actualizado.seconds)||0)-((a.actualizado&&a.actualizado.seconds)||0));
  const ago=v=>{const m=Math.max(0,Math.round((Date.now()-((v.actualizado&&v.actualizado.seconds)||0)*1000)/60000));return m<1?'ahora mismo':m<60?'hace '+m+' min':'hace más de 1 hora'};
  h+=`<p style="color:#555;margin:6px 0 10px">Clientes con cuenta que están armando un pedido. Se actualiza solo. Verde = activo en los últimos 15 minutos.</p><div class="list">${L.length?L.map(v=>{const it=v.items||[];const tot=it.reduce((a,x)=>a+(x.pr||0)*(x.q||0),0);const on=actv(v);
   return `<div class="cli" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${on?'#1fa855':'#bbb'};margin-right:6px"></span>${esc(v.nombre||'Cliente')}</b><span style="color:#555;font-size:13px">${ago(v)}</span></div>
   ${v.tel&&wa(v.tel)?`<a href="${wa(v.tel)}" target="_blank" rel="noopener" style="font-size:13px">${esc(v.tel)}</a>`:''}
   <div style="margin-top:6px"><small style="color:#555">En el carrito (${it.length}):</small>${it.length?`<ul style="margin:4px 0 0 18px;padding:0">${it.map(x=>`<li>${x.q} × ${esc(x.t)} ${x.c?`<small style="color:#C8102E">Cód. ${esc(x.c)}</small>`:''} ${x.pr?`<small>${crc(x.pr*x.q)}</small>`:''}</li>`).join('')}</ul><div style="margin-top:4px"><b>Total aprox. ${crc(tot)}</b></div>`:' <small>vacío</small>'}</div>
   ${(v.busquedas||[]).length?`<div style="margin-top:6px"><small style="color:#555">Ha buscado:</small> ${(v.busquedas||[]).slice().reverse().map(q=>`<span class="pill gray">${esc(q)}</span>`).join(' ')}</div>`:''}
   ${(v.vistos||[]).length?`<div style="margin-top:6px"><small style="color:#555">Ha visto:</small> ${(v.vistos||[]).slice().reverse().map(x=>`<span class="pill gray">${esc(x.n||x.id)}</span>`).join(' ')}</div>`:''}</div>`}).join(''):'<div class="empty">Nadie está armando un pedido en este momento.</div>'}</div>`}

 else if(tab==='clientes'&&cliv==='sis'){h+=sisPanel()}

 else if(tab==='clientes'){const L=clis.filter(c=>!filtro||JSON.stringify(c).toLowerCase().includes(filtro));
  h+=cliToggle()+`<input class="search" id="fs" placeholder="Buscar cliente por nombre, teléfono o correo" value="${esc(filtro)}"><div class="list">${L.length?L.map(c=>`<div class="cli"><div><b>${esc(c.nombre||'(sin nombre)')}</b> ${c.codigo?`<span class="pill ok">Cliente ApliTeam Nº ${esc(c.codigo)}</span>`:''} ${c.solicitaMayoreo&&!c.mayoreo?'<span class="pill">Pide mayoreo</span>':''}<br><small>${esc(c.tel||'')} · ${esc(c.correo||'')}${c.negocio?' · '+esc(c.negocio):''}</small>${c.dir?`<br><small>${esc(c.dir)}</small>`:''}</div>
   <div style="display:flex;gap:8px;align-items:center">${wa(c.tel)?`<a class="wa" style="height:40px;display:inline-flex;align-items:center;border-radius:10px;padding:0 10px;background:#1fa855;color:#fff;font-weight:700;text-decoration:none" href="${wa(c.tel)}" target="_blank" rel="noopener">WhatsApp</a>`:''}<label class="sw"><input type="checkbox" data-may="${c.id}"${c.mayoreo?' checked':''}>Mayoreo</label></div></div>`).join(''):'<div class="empty">No hay clientes todavía.</div>'}</div>`}
 else{const hoy=new Date();const H=ords.filter(o=>sameDay(oDate(o),hoy)&&o.estado!=='cancelado');const pend=ords.filter(o=>['nuevo','confirmado','listo'].includes(o.estado));
  h+=`<div class="sum"><div><small>Pedidos hoy</small><b>${H.length}</b></div><div><small>Monto de hoy (aprox.)</small><b>${crc(H.reduce((a,o)=>a+oTot(o),0))}</b></div><div><small>Pendientes</small><b>${pend.length}</b></div><div><small>Monto pendiente (aprox.)</small><b>${crc(pend.reduce((a,o)=>a+oTot(o),0))}</b></div></div>`;
  const L=ords.filter(o=>tab==='todos'||(tab==='proceso'?['confirmado','listo'].includes(o.estado):o.estado===tab)).filter(o=>!ofil||JSON.stringify([o.num,o.cliente,o.dir,o.notas,(o.items||[]).map(x=>[x.n,x.c])]).toLowerCase().includes(ofil));
  h+=`<div class="tools"><input class="search" id="of" placeholder="Buscar pedido por cliente, teléfono, número o producto" value="${esc(ofil)}" style="margin:0"><button id="csv" type="button">Exportar a Excel</button></div>`;
