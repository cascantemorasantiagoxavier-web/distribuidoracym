<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración · Distribuidora C y M</title>
<link rel="icon" href="logo.webp">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f3ec;color:#111;font-size:16px}
header{background:#111;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{height:38px;background:#fff;border-radius:8px;padding:2px 6px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:#333;color:#fff;border:0;border-radius:10px;height:40px;padding:0 12px;font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.login{max-width:420px;margin:8vh auto}
label{display:block;font-weight:700;margin:10px 0 5px}
input,select,textarea{width:100%;height:48px;border:1.5px solid #ccc;border-radius:11px;padding:0 12px;font-size:16px;font-family:inherit;background:#fff}
.go{width:100%;height:52px;border:0;border-radius:12px;background:#ffc400;font-weight:800;font-size:17px;margin-top:14px}
.msg{min-height:22px;margin-top:10px;font-weight:600;color:#b00020}
.tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{height:44px;border:0;border-radius:22px;padding:0 16px;font-weight:700;background:#e8e4da}
.tabs button.on{background:#111;color:#fff}
.tabs .n{display:inline-block;min-width:22px;border-radius:11px;background:#ffc400;color:#111;margin-left:6px;padding:0 6px;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.ord{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:6px solid #ccc}
.ord.nuevo{border-left-color:#ffc400}.ord.confirmado,.ord.listo{border-left-color:#3b82f6}.ord.entregado{border-left-color:#16a34a}.ord.cancelado{border-left-color:#dc2626;opacity:.75}
.ord .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ord h3{margin:0;font-size:18px}
.ord small{color:#555}
.ord .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ord .acts a,.ord .acts button{height:42px;display:inline-flex;align-items:center;border-radius:10px;padding:0 12px;font-weight:700;text-decoration:none;border:0;background:#eee;color:#111}
.ord .acts .wa{background:#1fa855;color:#fff}
.ord select{width:auto;height:42px;font-weight:700}
.ord ul{margin:8px 0 0;padding-left:20px}
.ord li{margin:3px 0}
.ord .code{color:#666;font-size:13px}
.cli{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.cli .sw{display:flex;align-items:center;gap:8px;font-weight:700}
.cli input[type=checkbox]{width:26px;height:26px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700;background:#fff4c2}
.pill.at{background:#dff3e4}.pill.aterr{background:#fde2e2}
.empty{padding:30px;text-align:center;color:#555}
.search{margin-bottom:10px}
</style>
</head>
<body>
<header><img src="logo.webp" alt="C y M"><h1>Administración</h1><button id="out" hidden>Salir</button></header>
<main id="app"><div class="card login"><p>Cargando…</p></div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,updateDoc,collection,query,orderBy,limit,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const CFG={"apiKey": "AIzaSyD9cadZeJCAz29qe_hhpx3fH6mZQU08DYU", "authDomain": "distribuidora-cym.firebaseapp.com", "projectId": "distribuidora-cym", "storageBucket": "distribuidora-cym.firebasestorage.app", "messagingSenderId": "321804284441", "appId": "1:321804284441:web:f2006ed7721c54e09d7088"};
const app=initializeApp(CFG);const auth=getAuth(app);auth.languageCode='es';const db=getFirestore(app);
const $=s=>document.querySelector(s);const A=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EST={nuevo:'Nuevo',confirmado:'Confirmado',listo:'Listo para entregar',entregado:'Entregado',cancelado:'Cancelado'};
let tab='nuevo',ords=[],clis=[],unsub=[],firstLoad=true,known=new Set(),filtro='';
function loginView(msg){A.innerHTML=`<div class="card login"><h2 style="margin:0 0 6px">Ingresar</h2><p style="margin:0;color:#555">Solo para la administración de la tienda.</p>
 <form id="lf"><label for="m">Correo</label><input id="m" type="email" autocomplete="email" required><label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
 <button class="go">Ingresar</button><div class="msg" id="lm">${esc(msg||'')}</div></form><button id="olv" style="background:none;border:0;text-decoration:underline;font-weight:600;margin-top:8px;padding:8px 0">¿Olvidó su contraseña?</button></div>`;
 $('#lf').addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#m').value.trim(),$('#p').value)}catch(er){$('#lm').textContent='Correo o contraseña incorrectos.'}});
 $('#olv').addEventListener('click',async()=>{const m=$('#m').value.trim();if(!m){$('#lm').textContent='Escriba su correo arriba.';return}try{await sendPasswordResetEmail(auth,m);$('#lm').style.color='#0a7a2f';$('#lm').textContent='Le enviamos un correo para cambiar la contraseña.'}catch(e){$('#lm').textContent='No se pudo enviar el correo.'}})}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,0.25].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.18)})}catch(e){}}
function tel8(s){return String(s||'').replace(/\D/g,'')}
function wa(t,txt){const n=tel8(t);if(n.length<8)return null;return 'https://wa.me/'+(n.length===8?'506'+n:n)+(txt?'?text='+encodeURIComponent(txt):'')}
function oText(o){const L=[`PEDIDO ${o.num}`,`Fecha: ${o.fecha}`,`Cliente: ${o.cliente?.nombre}`,`Teléfono: ${o.cliente?.tel}`];if(o.cliente?.negocio)L.push(`Negocio: ${o.cliente.negocio}`);L.push(`Entrega: ${o.entrega==='envio'?'Envío — '+(o.dir||''):'Retiro en el local'}`);if(o.notas)L.push(`Notas: ${o.notas}`);L.push('','Productos:');(o.items||[]).forEach(x=>L.push(`- ${x.q} × ${x.n}${x.c?' (Cód. '+x.c+')':''}${x.m?' Mod. '+x.m:''}`));L.push('',`Total de unidades: ${o.unidades}`);return L.join('\n')}
function atPill(a){if(!a)return '';if(a.estado==='ok')return `<span class="pill at">ApliTeam: Cotización ${esc(a.cot||'')}${a.sinCodigo?' · '+esc(a.sinCodigo)+' sin código':''}</span>`;if(a.estado==='error')return `<span class="pill aterr" title="${esc(a.msg||'')}">ApliTeam: no se pudo pasar</span>`;return '<span class="pill">Pasando a ApliTeam…</span>'}
function render(){const cnt=k=>ords.filter(o=>k==='todos'||(k==='proceso'?['confirmado','listo'].includes(o.estado):o.estado===k)).length;
 const nn=cnt('nuevo');document.title=(nn?`(${nn}) `:'')+'Administración · C y M';
 const T=[['nuevo','Nuevos'],['proceso','En proceso'],['entregado','Entregados'],['todos','Todos'],['clientes','Clientes']];
 let h=`<div class="tabs">${T.map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}${k==='clientes'?(clis.filter(c=>c.solicitaMayoreo&&!c.mayoreo).length?`<span class="n">${clis.filter(c=>c.solicitaMayoreo&&!c.mayoreo).length}</span>`:''):(cnt(k)&&k!=='todos'&&k!=='entregado'?`<span class="n">${cnt(k)}</span>`:'')}</button>`).join('')}</div>`;
 if(tab==='clientes'){const L=clis.filter(c=>!filtro||JSON.stringify(c).toLowerCase().includes(filtro));
  h+=`<input class="search" id="fs" placeholder="Buscar cliente por nombre, teléfono o correo" value="${esc(filtro)}"><div class="list">${L.length?L.map(c=>`<div class="cli"><div><b>${esc(c.nombre||'(sin nombre)')}</b> ${c.solicitaMayoreo&&!c.mayoreo?'<span class="pill">Pide mayoreo</span>':''}<br><small>${esc(c.tel||'')} · ${esc(c.correo||'')}${c.negocio?' · '+esc(c.negocio):''}</small>${c.dir?`<br><small>${esc(c.dir)}</small>`:''}</div>
   <div style="display:flex;gap:8px;align-items:center">${wa(c.tel)?`<a class="wa" style="height:40px;display:inline-flex;align-items:center;border-radius:10px;padding:0 10px;background:#1fa855;color:#fff;font-weight:700;text-decoration:none" href="${wa(c.tel)}" target="_blank" rel="noopener">WhatsApp</a>`:''}<label class="sw"><input type="checkbox" data-may="${c.id}"${c.mayoreo?' checked':''}>Mayoreo</label></div></div>`).join(''):'<div class="empty">No hay clientes todavía.</div>'}</div>`}
 else{const L=ords.filter(o=>tab==='todos'||(tab==='proceso'?['confirmado','listo'].includes(o.estado):o.estado===tab));
  h+=`<div class="list">${L.length?L.map(o=>{const w=wa(o.cliente?.tel,`Hola ${o.cliente?.nombre||''}, le escribimos de Distribuidora C y M sobre su pedido ${o.num}.`);return `<div class="ord ${esc(o.estado)}"><div class="top"><div><h3>${esc(o.cliente?.nombre||'')} ${o.sitio==='mayoreo'?'<span class="pill">Mayoreo</span>':''} ${atPill(o.apliteam)}</h3><small>Pedido ${esc(o.num)} · ${esc(o.fecha||'')}<br>${esc(o.cliente?.tel||'')}${o.cliente?.negocio?' · '+esc(o.cliente.negocio):''} · ${o.entrega==='envio'?'Envío: '+esc(o.dir||''):'Retiro en el local'}</small>${o.notas?`<br><small><b>Notas:</b> ${esc(o.notas)}</small>`:''}</div>
   <select data-est="${o.id}" aria-label="Estado">${Object.entries(EST).map(([k,l])=>`<option value="${k}"${o.estado===k?' selected':''}>${l}</option>`).join('')}</select></div>
   <ul>${(o.items||[]).map(x=>`<li><b>${x.q} ×</b> ${esc(x.n)} <span class="code">${x.c?'Cód. '+esc(x.c):''}${x.m?' · Mod. '+esc(x.m):''}</span></li>`).join('')}</ul><small><b>${o.unidades||0}</b> unidades</small>
   <div class="acts">${w?`<a class="wa" href="${w}" target="_blank" rel="noopener">WhatsApp</a>`:''}${o.cliente?.tel?`<a href="tel:${esc(tel8(o.cliente.tel))}">Llamar ${esc(o.cliente.tel)}</a>`:''}<button data-copy="${o.id}">Copiar pedido</button></div></div>`}).join(''):'<div class="empty">No hay pedidos aquí.</div>'}</div>`}
 A.innerHTML=h;const fs=$('#fs');if(fs){fs.addEventListener('input',()=>{filtro=fs.value.toLowerCase();const p=fs.selectionStart;render();const f2=$('#fs');f2.focus();f2.setSelectionRange(p,p)})}}
A.addEventListener('click',async e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
 const c=e.target.closest('[data-copy]');if(c){const o=ords.find(x=>x.id===c.dataset.copy);try{await navigator.clipboard.writeText(oText(o));c.textContent='Copiado ✓'}catch(er){c.textContent='No se pudo copiar'}}});
A.addEventListener('change',async e=>{const s=e.target.closest('[data-est]');if(s){try{await updateDoc(doc(db,'pedidos',s.dataset.est),{estado:s.value})}catch(er){alertMsg('No se pudo cambiar el estado.')}return}
 const m=e.target.closest('[data-may]');if(m){try{await updateDoc(doc(db,'clientes',m.dataset.may),{mayoreo:m.checked});const c=clis.find(x=>x.id===m.dataset.may);if(c)c.mayoreo=m.checked;render()}catch(er){m.checked=!m.checked;alertMsg('No se pudo guardar.')}}});
function alertMsg(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:12px;right:12px;bottom:16px;background:#b00020;color:#fff;padding:14px;border-radius:12px;font-weight:700;z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
$('#out').addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];$('#out').hidden=!u;if(!u){loginView();return}
 let ok=false;try{ok=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){}
 if(!ok){A.innerHTML=`<div class="card login"><h2>Sin acceso</h2><p>Esta cuenta (${esc(u.email)}) no es de administrador.</p><p style="color:#555;font-size:14px">Código de la cuenta: ${esc(u.uid)}</p></div>`;return}
 A.innerHTML='<div class="empty">Cargando pedidos…</div>';firstLoad=true;
 unsub.push(onSnapshot(query(collection(db,'pedidos'),orderBy('creado','desc'),limit(300)),s=>{ords=s.docs.map(d=>({id:d.id,...d.data()}));
   const nuevos=ords.filter(o=>o.estado==='nuevo'&&!known.has(o.id));if(!firstLoad&&nuevos.length)beep();ords.forEach(o=>known.add(o.id));firstLoad=false;render()},er=>{A.innerHTML='<div class="empty">No se pudieron cargar los pedidos.</div>'}));
 unsub.push(onSnapshot(collection(db,'clientes'),s=>{clis=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.creado&&b.creado.seconds)||0)-((a.creado&&a.creado.seconds)||0));render()}))});
</script>
</body>
</html>
