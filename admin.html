const edOf=id=>CAMB.productos['p'+id]||{};
const tOf=p=>edOf(p.id).t||p.t;
function sprTh(p,big){const cl='th'+(big?' big':'');if(CAMB.fotos['p'+p.id])return `<span class="${cl}" data-fth="${p.id}"${FC[p.id]?` style="background-image:url(${FC[p.id]});background-size:contain"`:''}></span>`;if(!p.i)return `<span class="${cl} none">Sin foto</span>`;const [s,j]=p.i.split('.').map(Number);return `<span class="${cl}" style="background-image:url(sp/${String(s).padStart(2,'0')}.webp);background-size:600% 600%;background-position:${(j%6)*20}% ${Math.floor(j/6)*20}%"></span>`}
async function fillThumbs(root){for(const el of root.querySelectorAll('[data-fth]')){const id=el.dataset.fth;if(!FC[id]){try{const s=await getDoc(doc(db,'fotos',String(id)));if(s.exists())FC[id]=s.data().img}catch(e){}}if(FC[id]){el.style.backgroundImage=`url(${FC[id]})`;el.style.backgroundSize='contain'}}}
/* ===== Clientes de ApliTeam (los que pueden activar su cuenta con la cédula) ===== */
let cliv='web',SISL=null,sisCargando=false;
function cliToggle(){const n=SISL?SISL.length:'',m=CONL?CONL.length:'';return `<div class="ctog"><button type="button" data-cliv="web" class="${cliv==='web'?'on':''}">Con cuenta en la página (${clis.length})</button><button type="button" data-cliv="sis" class="${cliv==='sis'?'on':''}">Clientes de ApliTeam${n?' ('+n+')':''}</button></div>`}
let CONL=null,conCargando=false;
async function cargarCon(){if(CONL||conCargando)return;conCargando=true;try{const t=await getDoc(doc(db,'sistema_lista','contado'));CONL=t.exists()&&Array.isArray(t.data().l)?t.data().l.map(x=>({n:String(x.n||''),f:+x.f||0,u:String(x.u||''),t:String(x.t||'')})):[]}catch(er){CONL=[];alertMsg('No se pudo cargar la lista de clientes de contado.')}conCargando=false;if(tab==='clientes'&&cliv==='con')render()}
const nN=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
function conPanel(){if(!CONL){cargarCon();return cliToggle()+'<div class="empty">Cargando clientes de contado…</div>'}
 const web=new Map();clis.forEach(c=>{[c.nombre,c.negocio].forEach(v=>{if(v)web.set(nN(v),c)})});
 const L=CONL.filter(x=>!filtro||(x.n+' '+x.t).toLowerCase().includes(filtro)).slice(0,400);
 return cliToggle()+`<p class="hint">Clientes que en ApliTeam se facturan <b>de contado</b> pero con su nombre (por ejemplo SUPER YIJI), ordenados por cuántas facturas tienen. No tienen cédula en ApliTeam, así que entran a la página con <b>Crear cuenta</b> normal. Si quiere que activen con la cédula como los demás, créelos como cliente en ApliTeam con su cédula.</p>
  <input class="search" id="fs" placeholder="Buscar por nombre o teléfono" value="${esc(filtro)}"><div class="list">${L.map(x=>{const c=web.get(nN(x.n));return `<div class="cli"><div><b>${esc(x.n)}</b><br><small>${x.f} factura${x.f===1?'':'s'}${x.u?' · última: '+esc(x.u.split('-').reverse().join('/')):''}${x.t?' · Tel. '+esc(x.t):''}</small>${c?'<br><small style="color:#0a7a2f;font-weight:700">✓ Tiene cuenta en la página</small>':''}</div>
   <div>${x.t&&wa(x.t)?`<a class="wa" style="height:40px;display:inline-flex;align-items:center;border-radius:10px;padding:0 10px;background:#1fa855;color:#fff;font-weight:700;text-decoration:none" href="${wa(x.t)}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div></div>`}).join('')||'<div class="empty">No hay clientes con ese nombre.</div>'}${CONL.length>L.length&&!filtro?`<div class="empty">Se muestran los primeros 400 de ${CONL.length}. Use el buscador para ver los demás.</div>`:''}</div>`}
async function cargarSis(){if(SISL||sisCargando)return;sisCargando=true;try{const t=await getDoc(doc(db,'sistema_lista','todos'));if(t.exists()&&Array.isArray(t.data().l))SISL=t.data().l.map(x=>({cod:String(x.cod||'').trim(),n:String(x.n||''),m:String(x.m||''),t:String(x.t||'ok')}));else{const s=await getDocs(collection(db,'sistema'));SISL=s.docs.map(d=>({cod:String(d.data().cod||'').trim(),n:String(d.data().n||''),m:String(d.data().m||''),t:'ok'}))}SISL.sort((a,b)=>a.n.localeCompare(b.n,'es'))}catch(er){SISL=[];alertMsg('No se pudo cargar la lista de clientes de ApliTeam.')}sisCargando=false;if(tab==='clientes'&&cliv==='sis')render()}
function sisPanel(){if(!SISL){cargarSis();return cliToggle()+'<div class="empty">Cargando clientes de ApliTeam…</div>'}
 const web=new Map(clis.filter(c=>c.codigo).map(c=>[String(c.codigo).trim(),c]));const act=SISL.filter(x=>web.has(x.cod)).length;
 const L=SISL.filter(x=>!filtro||(x.n+' '+x.cod+' '+x.m).toLowerCase().includes(filtro));
 return cliToggle()+`<p class="hint">Estos son sus clientes de ApliTeam. Cada uno puede entrar a la página con <b>Crear cuenta</b> poniendo su cédula. Ya activaron su cuenta: <b>${act}</b> de ${SISL.length}.</p>
  <input class="search" id="fs" placeholder="Buscar por nombre o código" value="${esc(filtro)}"><div class="list">${L.map(x=>{const c=web.get(x.cod);return `<div class="cli"><div><b>${esc(x.n||'(sin nombre)')}</b> <small>Cód. ${esc(x.cod)}</small><br><small>${c?'✓ Ya tiene cuenta en la página'+(c.tel?' · '+esc(c.tel):'')+(c.correo?' · '+esc(c.correo):''):(x.t==='sinced'?'⚠️ No tiene cédula completa en ApliTeam: para que active su cuenta, corrija la cédula en ApliTeam':'Todavía no activa su cuenta'+(x.t==='dup'?' · comparte cédula con otro cliente (al activar escoge cuál es)':''))+(x.m?' · correo en ApliTeam: '+esc(x.m):'')}</small></div>
   <div>${c?`<label class="sw"><input type="checkbox" data-may="${c.id}"${c.mayoreo?' checked':''}>Mayoreo</label>`:'<span class="pill gray">Sin cuenta</span>'}</div></div>`}).join('')||'<div class="empty">No hay clientes con ese nombre.</div>'}</div>`}
A.addEventListener('click',e=>{const b=e.target.closest('[data-cliv]');if(b){cliv=b.dataset.cliv;filtro='';render()}});
function prodPanel(){return `<div id="edwrap" data-t="productos"><div class="openb"><a class="go2" href="index.html?editar">✏️ Editar la tienda</a><a class="go2 dk" href="mayoreo.html?editar">✏️ Editar mayoreo</a></div><p class="hint">Toque un botón de arriba: se abre la página como la ven los clientes y usted toca cualquier producto para cambiarlo. O aquí abajo también puede buscarlo por nombre. Busque el producto y tóquelo para cambiarle la <b>foto</b>, el <b>nombre</b>, la <b>descripción</b> o el <b>precio</b>, o para ocultarlo. Los cambios salen en la tienda y en la de mayoreo.</p>
 <input class="search" id="pq" placeholder="Buscar por nombre, código o modelo" value="${esc(pq)}" autocomplete="off"><div id="pres" class="plist"></div></div>`}
function prodRow(p){const x=edOf(p.id),tags=[CAMB.fotos['p'+p.id]?'Foto nueva':'',x.t||x.d?'Texto cambiado':'',x.pr||x.pm?'Precio cambiado':'',x.oculto?'Oculto':''].filter(Boolean);
 const pr=x.pr||p.pr;return `<button class="prow" data-ed="${p.id}">${sprTh(p)}<span class="pt"><b>${esc(tOf(p))}</b><small>Cód. ${esc(p.c)}${p.m?' · Mod. '+esc(p.m):''}${pr?' · '+crc(pr):''}</small>${tags.map(t=>`<span class="pill">${t}</span>`).join(' ')}</span></button>`}
async function prodList(){const box=$('#pres');if(!box)return;const L=await loadProds();let R,head='';
 if(pq.trim()){const w=nrm(pq).split(/\s+/).filter(Boolean);R=L.filter(p=>w.every(t=>p._s.includes(t)||nrm(tOf(p)).includes(t))).slice(0,60);head=R.length?'':'<div class="empty">No encontré productos con eso.</div>'}
 else{const ids=new Set([...Object.keys(CAMB.productos),...Object.keys(CAMB.fotos)].map(k=>+k.slice(1)));R=L.filter(p=>ids.has(p.id));head=R.length?`<h3 class="sub">Productos que usted ya cambió (${R.length})</h3>`:'<div class="empty">Escriba arriba el nombre o código del producto que quiere cambiar.</div>'}
 box.innerHTML=head+R.map(prodRow).join('');fillThumbs(box)}
function prodInit(){const i=$('#pq');let tm;i.addEventListener('input',()=>{pq=i.value;clearTimeout(tm);tm=setTimeout(prodList,180)});prodList()}
A.addEventListener('click',e=>{const b=e.target.closest('[data-ed]');if(b)openEditor(+b.dataset.ed)});
/* --- editor de un producto --- */
let EP=null,IM=null,R=0,Z=1,OX=0,OY=0;
function draw(){const c=$('#fcv');if(!c)return;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,800,800);if(!IM)return;const w=IM.width,h=IM.height,rw=R%2?h:w,rh=R%2?w:h,s=Math.min(760/rw,760/rh)*Z;x.save();x.translate(400+OX,400+OY);x.rotate(R*Math.PI/2);x.scale(s,s);x.drawImage(IM,-w/2,-h/2);x.restore()}
async function loadFile(f){if(!f)return;const url=URL.createObjectURL(f);try{const im=new Image();im.src=url;await im.decode();const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);IM=c;R=0;Z=1;OX=OY=0;$('#fz').value=1;$('#fcv').hidden=false;$('#fold').hidden=true;$('#fctl').hidden=false;draw()}catch(er){alertMsg('No se pudo abrir esa foto. Pruebe con otra.')}finally{URL.revokeObjectURL(url)}}
function openEditor(id){const p=PRODS&&PRODS.find(x=>x.id===id);if(!p)return;EP=p;IM=null;const x=edOf(id),hasF=!!CAMB.fotos['p'+id];
 const o=document.createElement('div');o.className='fed';o.id='fed';o.innerHTML=`<div class="fbox"><div class="fhead"><b>Editar producto</b><button type="button" id="fx" aria-label="Cerrar">✕</button></div>
 <small>Cód. ${esc(p.c)}${p.m?' · Mod. '+esc(p.m):''}</small>
 <label>Foto</label><div class="fwrap"><div id="fold">${sprTh(p,true)}</div><canvas id="fcv" width="800" height="800" hidden></canvas></div>
 <div class="fbtns"><label class="btn2">📷 Tomar foto<input type="file" accept="image/*" capture="environment" id="fcam" hidden></label><label class="btn2">🖼️ Escoger de la galería<input type="file" accept="image/*" id="fgal" hidden></label></div>
 <div id="fctl" hidden><small>Arrastre la foto con el dedo para acomodarla. Use la barra para acercarla o alejarla.</small><input type="range" id="fz" min="0.3" max="4" step="0.01" value="1" aria-label="Acercar o alejar"><div class="fbtns"><button type="button" class="btn2" id="frot">↻ Girar</button><button type="button" class="btn2" id="ffit">Centrar</button><button type="button" class="btn2" id="fcan">No usar esta foto</button></div></div>
 ${hasF?'<button type="button" class="btn2 warn" id="fdel">Quitar la foto que puse (vuelve la de antes)</button>':''}
 <label for="ft">Nombre</label><input id="ft" value="${esc(x.t||p.t)}">
 <label for="fd">Descripción</label><textarea id="fd" rows="4">${esc(x.d||p.d)}</textarea>
 <label for="fpr">Precio en la tienda, con IVA (₡)</label><input id="fpr" inputmode="decimal" value="${x.pr||p.pr||''}">
 <label for="fpm">Precio en mayoreo, con IVA (₡)</label><input id="fpm" inputmode="decimal" value="${x.pm||''}" placeholder="Vacío = el mismo de la tienda">
 <label class="chk"><input type="checkbox" id="fo"${x.oculto?' checked':''}> Ocultar este producto (no sale en la tienda)</label>
 <button type="button" class="go" id="fsv">Guardar cambios</button><div class="msg" id="fmsg"></div>
 ${Object.keys(x).length?'<button type="button" class="btn2" id="frs">Dejar el nombre, descripción y precio como estaban</button>':''}</div>`;
 document.body.appendChild(o);document.body.style.overflow='hidden';fillThumbs(o);
 const cv=$('#fcv'),pts=new Map();let pd0=0,z0=1;
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];pd0=Math.hypot(a.x-b.x,a.y-b.y);z0=Z}});
 cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const q=pts.get(e.pointerId),k=800/cv.clientWidth;if(pts.size===1){OX+=(e.clientX-q.x)*k;OY+=(e.clientY-q.y)*k}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2&&pd0){const [a,b]=[...pts.values()];Z=Math.max(.3,Math.min(4,z0*Math.hypot(a.x-b.x,a.y-b.y)/pd0));$('#fz').value=Z}draw()});
 const up=e=>{pts.delete(e.pointerId);pd0=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 $('#fcam').addEventListener('change',e=>loadFile(e.target.files[0]));$('#fgal').addEventListener('change',e=>loadFile(e.target.files[0]));
 $('#fz').addEventListener('input',e=>{Z=+e.target.value;draw()});$('#frot').onclick=()=>{R=(R+1)%4;draw()};$('#ffit').onclick=()=>{Z=1;OX=OY=0;$('#fz').value=1;draw()};
 $('#fcan').onclick=()=>{IM=null;$('#fcv').hidden=true;$('#fold').hidden=false;$('#fctl').hidden=true};
 $('#fx').onclick=closeEditor;o.addEventListener('click',e=>{if(e.target===o)closeEditor()});
 if($('#fdel'))$('#fdel').onclick=async()=>{if(!confirm('¿Quitar la foto que usted puso a este producto?'))return;try{await deleteDoc(doc(db,'fotos',String(id)));await setMap('fotos','p'+id,null);delete FC[id];closeEditor();toast('Foto quitada')}catch(er){$('#fmsg').textContent='No se pudo quitar. Revise el internet.'}};
 if($('#frs'))$('#frs').onclick=async()=>{try{await setMap('productos','p'+id,null);closeEditor();toast('Listo, quedó como estaba')}catch(er){$('#fmsg').textContent='No se pudo guardar. Revise el internet.'}};
 $('#fsv').onclick=saveEditor}
function closeEditor(){const o=$('#fed');if(o)o.remove();document.body.style.overflow='';EP=null;IM=null;prodList()}
async function setMap(d,k,v){const r=doc(db,'cambios',d),del=v===null;try{await updateDoc(r,{[k]:del?deleteField():v})}catch(er){if(er&&er.code==='not-found'){if(del)return;await setDoc(r,{[k]:v})}else throw er}}
async function saveEditor(){const p=EP;if(!p)return;const b=$('#fsv'),m=$('#fmsg');b.disabled=true;m.style.color='#555';m.textContent='Guardando…';
 try{if(IM){const c=$('#fcv');let q=.86,u=c.toDataURL('image/jpeg',q);while(u.length>950000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}const v=Date.now();
   await setDoc(doc(db,'fotos',String(p.id)),{img:u,v,c:p.c,t:p.t,por:auth.currentUser&&auth.currentUser.email||''});await setMap('fotos','p'+p.id,v);FC[p.id]=u}
  const x={},t=$('#ft').value.trim(),d=$('#fd').value.trim(),pr=numCR($('#fpr').value);
  if(t&&t!==p.t)x.t=t;if(d&&d!==p.d)x.d=d;if(pr>0&&Math.abs(pr-(p.pr||0))>.004)x.pr=Math.round(pr*100)/100;const pm=numCR($('#fpm').value);if(pm>0)x.pm=Math.round(pm*100)/100;if($('#fo').checked)x.oculto=true;
  const had=Object.keys(edOf(p.id)).length;if(Object.keys(x).length){x.v=Date.now();await setMap('productos','p'+p.id,x)}else if(had)await setMap('productos','p'+p.id,null);
  closeEditor();toast('Guardado ✓ Ya sale en la tienda')}catch(er){b.disabled=false;m.style.color='#b00020';m.textContent=er&&er.code==='permission-denied'?'No tiene permiso para guardar.':'No se pudo guardar. Revise el internet e intente de nuevo.'}}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:12px;right:12px;bottom:16px;background:#0a7a2f;color:#fff;padding:14px;border-radius:12px;font-weight:700;z-index:30;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
/* --- datos de la tienda --- */
const TF=[['whatsapp','WhatsApp','Ej. 8888-8888'],['telefono','Teléfono','Ej. 2222-2222'],['correo','Correo para pedidos',''],['direccion','Dirección del local',''],['horario','Días y horas de atención','Ej. Lunes a sábado de 7 a. m. a 5 p. m.'],['entregas','Entregas','Ej. Retiro en el local o envío en la zona'],['mapa','Enlace de Google Maps',''],['facebook','Enlace de Facebook',''],['instagram','Enlace de Instagram','']];
function tiendaPanel(){const T=CAMB.tienda||{};return `<div id="edwrap" data-t="tienda" class="card"><p class="hint" style="margin-top:0">Estos datos salen abajo en la página, en los botones de WhatsApp y llamar, y en la de mayoreo.</p>
 ${TF.map(([k,l,ph])=>`<label for="tf_${k}">${l}</label><input id="tf_${k}" value="${esc(T[k]||'')}" placeholder="${esc(ph)}">`).join('')}
 <button type="button" class="go" id="tsv">Guardar datos</button><div class="msg" id="tmsg"></div></div>`}
function tiendaInit(){$('#tsv').onclick=async()=>{const o={};TF.forEach(([k])=>{const v=$('#tf_'+k).value.trim();if(v)o[k]=v});const m=$('#tmsg');try{await setDoc(doc(db,'cambios','tienda'),o);m.style.color='#0a7a2f';m.textContent='Guardado ✓'}catch(er){m.style.color='#b00020';m.textContent='No se pudo guardar. Revise el internet.'}}}
$('#out').addEventListener('click',()=>signOut(auth));
onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];$('#out').hidden=!u;if(!u){loginView();return}
 let ok=false;try{ok=(await getDoc(doc(db,'admins',u.uid))).exists()}catch(e){}
 if(!ok){A.innerHTML=`<div class="card login"><h2>Sin acceso</h2><p>Esta cuenta (${esc(u.email)}) no es de administrador.</p><p style="color:#555;font-size:14px">Código de la cuenta: ${esc(u.uid)}</p></div>`;return}
 A.innerHTML='<div class="empty">Cargando pedidos…</div>';firstLoad=true;
 unsub.push(onSnapshot(query(collection(db,'pedidos'),orderBy('creado','desc'),limit(300)),s=>{ords=s.docs.map(d=>({id:d.id,...d.data()}));
   const nuevos=ords.filter(o=>o.estado==='nuevo'&&!known.has(o.id));if(!firstLoad&&nuevos.length)beep();ords.forEach(o=>known.add(o.id));firstLoad=false;render()},er=>{A.innerHTML='<div class="empty">No se pudieron cargar los pedidos.</div>'}));
 unsub.push(onSnapshot(collection(db,'cambios'),s=>{const c={productos:{},tienda:{},fotos:{}};s.forEach(d=>{c[d.id]=d.data()});CAMB=c;if(tab==='productos'&&!$('#fed'))prodList()},er=>{}));
 unsub.push(onSnapshot(collection(db,'clientes'),s=>{clis=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.creado&&b.creado.seconds)||0)-((a.creado&&a.creado.seconds)||0));render()}))});
</script>
